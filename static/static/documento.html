<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Lexia360 · Documento</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css"/>
  <style>
    :root{ --bg:#f6f7fb; --card:#fff; --border:#e6e8ef; --muted:#667085; --brand:#0b5fff; }
    body{ margin:0; background:var(--bg); }
    header{ position:sticky; top:0; z-index:10; background:rgba(246,247,251,.92); backdrop-filter: blur(12px); border-bottom:1px solid var(--border); }
    .wrap{ max-width:1100px; margin:0 auto; padding:16px 18px; }
    .top{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
    .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; font-weight:1000; }
    .badge{ width:36px; height:36px; border-radius:12px; background:linear-gradient(135deg,var(--brand),#5b8cff); display:flex; align-items:center; justify-content:center; color:#fff; }
    .btn{ display:inline-flex; align-items:center; gap:8px; padding:10px 14px; border-radius:12px; border:1px solid var(--border); background:#fff; cursor:pointer; font-weight:900; text-decoration:none; color:inherit; }
    .btn.primary{ background:var(--brand); border-color:var(--brand); color:#fff; }
    .grid{ display:grid; grid-template-columns:1fr; gap:14px; margin-top:14px; }
    .card{ background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; box-shadow:0 18px 40px rgba(16,24,40,.07); }
    .muted{ color:var(--muted); }
    .small{ font-size:13px; }
    .pill{ display:inline-block; padding:6px 10px; border:1px solid var(--border); border-radius:999px; font-weight:900; font-size:12px; background:#fff; }
  </style>
</head>
<body>
<header>
  <div class="wrap top">
    <a class="brand" href="/static/dashboard.html">
      <div class="badge">⚖️</div>
      <div>Lexia360</div>
    </a>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <a class="btn" href="/static/documentos.html">📄 Documentos</a>
      <a class="btn" href="/static/inmuebles.html">🏠 Inmuebles</a>
      <button class="btn" onclick="logout()">Cerrar sesión</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="card">
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;">
      <div>
        <h3 style="margin:0;" id="title">Documento</h3>
        <div class="muted small" id="meta"></div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn primary" onclick="downloadPdf()">Descargar PDF</button>
      </div>
    </div>

    <hr/>

    <h4 style="margin:0 0 8px;">Checklist</h4>
    <div class="muted small" style="margin-bottom:10px;">(MVP: solo lectura. En el siguiente paso lo hacemos editable.)</div>
    <div id="checklist"></div>

    <hr/>

    <details>
      <summary>Debug JSON</summary>
      <pre id="json" style="margin-top:10px;"></pre>
    </details>
  </section>
</main>

<script>
  const api = location.origin;
  const token = localStorage.getItem("token");
  if(!token) location.href="/static/index.html";

  function logout(){
    localStorage.removeItem("token");
    localStorage.removeItem("email");
    location.href="/static/index.html";
  }

  const id = new URLSearchParams(location.search).get("id");
  if(!id) location.href="/static/documentos.html";

  async function safeJson(res){ try{return await res.json();}catch{return {};} }
  function esc(s){
    return String(s ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
  }

  let doc = null;

  async function load(){
    const r = await fetch(`${api}/documents/${id}`, { headers:{ Authorization:`Bearer ${token}` }});
    if(r.status===401) return logout();
    const d = await safeJson(r);
    if(!r.ok){ alert(d.detail || "No se pudo cargar el documento"); return; }

    doc = d;

    document.getElementById("title").textContent = d.titulo || `Documento ${id}`;
    document.getElementById("meta").innerHTML = `
      <span class="pill">${esc(d.tipo)}</span>
      <span class="pill">${esc(d.estado)}</span>
      <span class="muted small"> · ID ${d.id_document} · Inmueble ${d.id_inmueble ?? "—"} · ${esc((d.creado_en||"").replace("T"," ").slice(0,19))}</span>
    `;

    const wrap = document.getElementById("checklist");
    wrap.innerHTML = "";

    (d.checklist || []).forEach(it=>{
      wrap.innerHTML += `
        <label style="display:flex;align-items:flex-start;gap:10px;">
          <input type="checkbox" ${it.completado ? "checked" : ""} disabled />
          <span>
            <b>${esc(it.titulo)}</b><br/>
            <span class="muted small">${esc(it.descripcion || "")}</span>
          </span>
        </label>
      `;
    });

    document.getElementById("json").textContent = JSON.stringify(d, null, 2);
  }

  async function downloadPdf(){
    try{
      const res = await fetch(`${api}/documents/${id}/pdf`, { headers:{ Authorization:`Bearer ${token}` }});
      if(res.status===401) return logout();
      if(!res.ok){ const j=await safeJson(res); alert(j.detail||"No se pudo generar el PDF"); return; }

      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `lexia360_document_${id}.pdf`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 2000);
    }catch(e){
      alert("⚠️ Error de conexión");
    }
  }

  load();
</script>
</body>
</html>
