<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Lexia360 · Wizard Contrato (Lease)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css"/>
  <!-- Opcional: si separas frontend/backend:
  <meta name="api-base" content="https://tu-api.com"> -->
  <style>
    :root{ --brand:#0b5fff; --muted:#667085; --border:#e6e8ef; --danger:#b42318; --ok:#027a48; }
    body{ margin:0; background:#f6f7fb; }
    header{ position:sticky; top:0; z-index:10; background:rgba(246,247,251,.92); backdrop-filter: blur(12px); border-bottom:1px solid var(--border); }
    .wrap{ max-width:980px; margin:0 auto; padding:16px 18px; }
    .top{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
    .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; font-weight:1000; }
    .badge{ width:36px; height:36px; border-radius:12px; background:linear-gradient(135deg,var(--brand),#5b8cff); display:flex; align-items:center; justify-content:center; color:#fff; }
    .btn{ display:inline-flex; align-items:center; gap:8px; padding:10px 14px; border-radius:12px; border:1px solid var(--border); background:#fff; cursor:pointer; font-weight:900; text-decoration:none; color:inherit; }
    .btn.primary{ background:var(--brand); border-color:var(--brand); color:#fff; }
    .card{ background:#fff; border:1px solid var(--border); border-radius:16px; padding:16px; box-shadow:0 18px 40px rgba(16,24,40,.07); margin-top:14px; }
    .muted{ color:var(--muted); }
    .row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    @media(max-width:900px){ .row{ grid-template-columns:1fr; } }
    input, select{ border-radius:12px !important; }
    .toast{ margin-top:10px; font-weight:900; font-size:13px; }
    .toast.ok{ color:var(--ok); }
    .toast.err{ color:var(--danger); }
  </style>
</head>
<body>
<header>
  <div class="wrap top">
    <a class="brand" href="/static/dashboard.html" aria-label="Volver al dashboard">
      <div class="badge">⚖️</div>
      <div>Lexia360</div>
    </a>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <a class="btn" href="/static/inmuebles.html">🏠 Inmuebles</a>
      <a class="btn" href="/static/papelera.html">🗑️ Papelera</a>
      <button class="btn" type="button" onclick="logout()">Cerrar sesión</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="card">
    <h3 style="margin:0 0 6px;">Contrato de arrendamiento (MVP)</h3>
    <div class="muted" style="margin-bottom:12px;">
      Genera un documento “lease” y su checklist base.
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <label for="inmuebleId">Selecciona inmueble *</label>
    <select id="inmuebleId"></select>

    <div class="row" style="margin-top:10px;">
      <div>
        <label for="arrNombre">Arrendatario (nombre)</label>
        <input id="arrNombre" type="text" placeholder="Nombre y apellidos" autocomplete="name"/>
      </div>
      <div>
        <label for="arrDni">DNI/NIE</label>
        <input id="arrDni" type="text" placeholder="12345678X"/>
      </div>
    </div>

    <div class="row" style="margin-top:10px;">
      <div>
        <label for="fechaInicio">Fecha inicio</label>
        <input id="fechaInicio" type="date"/>
      </div>
      <div>
        <label for="duracion">Duración (meses)</label>
        <input id="duracion" type="number" min="1" placeholder="12" value="12"/>
      </div>
    </div>

    <div style="display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap; margin-top:14px;">
      <button class="btn primary" type="button" onclick="createLease()">Generar contrato</button>
    </div>
  </section>
</main>

<script>
  function getApiBase(){
    const meta = document.querySelector('meta[name="api-base"]');
    return (meta && meta.content) ? meta.content.replace(/\/+$/,'') : location.origin;
  }
  const api = getApiBase();

  function token(){ return localStorage.getItem("token"); }
  const t = token();
  if(!t) location.href="/static/index.html";

  function logout(){
    localStorage.removeItem("token");
    localStorage.removeItem("email");
    location.href="/static/index.html";
  }

  function setToast(text, ok=true){
    const el = document.getElementById("toast");
    el.className = "toast " + (ok ? "ok" : "err");
    el.textContent = text || "";
    if(text){
      setTimeout(()=>{ el.textContent=""; }, 2600);
    }
  }

  function esc(s){
    return String(s ?? "")
      .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
      .replaceAll('"',"&quot;").replaceAll("'","&#039;");
  }

  async function loadInmuebles(){
    try{
      const r = await fetch(`${api}/inmuebles`, { headers:{ Authorization:`Bearer ${token()}` }});
      if(r.status===401) return logout();
      const data = await r.json().catch(()=>[]);
      const sel = document.getElementById("inmuebleId");
      sel.innerHTML = "";

      if(!Array.isArray(data) || data.length===0){
        sel.innerHTML = `<option value="">(No tienes inmuebles, crea uno primero)</option>`;
        setToast("Crea un inmueble antes de generar contrato.", false);
        return;
      }

      for(const i of data){
        const opt = document.createElement("option");
        opt.value = i.id_inmueble;
        opt.textContent = `#${i.id_inmueble} · ${i.direccion || "—"}`;
        sel.appendChild(opt);
      }

      // Si vienes desde inmueble.html con ?inmueble_id=...
      const pre = new URLSearchParams(location.search).get("inmueble_id");
      if(pre){
        const exists = Array.from(sel.options).some(o => String(o.value) === String(pre));
        if(exists) sel.value = String(pre);
      }

    }catch(e){
      setToast("⚠️ No se pudo cargar inmuebles.", false);
    }
  }

  async function createLease(){
    const inmueble_id = Number(document.getElementById("inmuebleId").value || 0);
    if(!inmueble_id){
      setToast("Selecciona un inmueble.", false);
      return;
    }

    const arrendatario_nombre = document.getElementById("arrNombre").value.trim() || null;
    const arrendatario_dni = document.getElementById("arrDni").value.trim() || null;

    const fechaInicio = document.getElementById("fechaInicio").value;
    const fecha_inicio = fechaInicio ? fechaInicio : null;

    const durRaw = Number(document.getElementById("duracion").value || "12");
    const duracion_meses = (Number.isFinite(durRaw) && durRaw >= 1) ? Math.floor(durRaw) : 12;

    try{
      const r = await fetch(`${api}/documents/lease`, {
        method:"POST",
        headers:{
          "Authorization": `Bearer ${token()}`,
          "Content-Type":"application/json"
        },
        body: JSON.stringify({ inmueble_id, arrendatario_nombre, arrendatario_dni, fecha_inicio, duracion_meses })
      });

      if(r.status===401) return logout();
      const data = await r.json().catch(()=>({}));

      if(!r.ok){
        setToast(data.detail || "Error creando documento.", false);
        return;
      }

      setToast("✅ Contrato generado.", true);

      // Si tienes documento.html, perfecto:
      setTimeout(()=>location.href = `/static/documento.html?id=${encodeURIComponent(data.id_document)}`, 600);

    }catch(e){
      setToast("⚠️ No se pudo conectar.", false);
    }
  }

  // init
  document.getElementById("fechaInicio").value = new Date().toISOString().slice(0,10);
  loadInmuebles();
</script>
</body>
</html>
