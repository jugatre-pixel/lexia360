<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lexia360 · Legal inmobiliario claro</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
</head>

<body>
<main class="container" style="max-width:900px;">
  <h1>⚖️ Lexia360</h1>
  <p>Diagnóstico legal inmobiliario claro, rápido y documentado.</p>

  <article>
    <h3>Accede</h3>

    <label>Email</label>
    <input id="email" type="email">

    <label>Contraseña</label>
    <input id="password" type="password">

    <button onclick="login()">Entrar</button>
    <p id="msg"></p>
  </article>

  <hr>

  <article>
    <h3>Crear cuenta</h3>

    <label>Nombre</label>
    <input id="rNombre">

    <label>Email</label>
    <input id="rEmail" type="email">

    <label>Contraseña</label>
    <input id="rPassword" type="password">

    <button onclick="register()">Crear cuenta</button>
  </article>
</main>

<script>
const api = location.origin;

(async()=>{
  const t = localStorage.getItem("token");
  if(!t) return;
  const r = await fetch(`${api}/me`,{headers:{Authorization:`Bearer ${t}`}});
  if(r.ok) location.href="/static/dashboard.html";
})();

async function login(){
  const f = new URLSearchParams();
  f.append("username", email.value);
  f.append("password", password.value);
  const r = await fetch(`${api}/token`,{method:"POST",body:f});
  const d = await r.json();
  if(d.access_token){
    localStorage.setItem("token",d.access_token);
    localStorage.setItem("email",email.value);
    location.href="/static/dashboard.html";
  } else msg.textContent="Credenciales incorrectas";
}

async function register(){
  await fetch(`${api}/register`,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      nombre:rNombre.value,
      email:rEmail.value,
      password:rPassword.value
    })
  });
  alert("Cuenta creada. Ahora inicia sesión.");
}
</script>
</body>
</html>
