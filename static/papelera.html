<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<title>Lexia360 · Papelera</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css"/>
</head>
<body>
<main class="container">
<h2>Papelera</h2>
<table>
<thead><tr><th>ID</th><th>Dirección</th><th>Acciones</th></tr></thead>
<tbody id="rows"></tbody>
</table>
</main>

<script>
const api=location.origin;
const token=localStorage.getItem("token");
if(!token) location.href="/static/index.html";

async function load(){
  const r=await fetch(api+"/inmuebles/trash",{headers:{Authorization:`Bearer ${token}`}});
  if(r.status===401) location.href="/static/index.html";
  const d=await r.json();
  const t=document.getElementById("rows");
  t.innerHTML="";
  d.forEach(i=>{
    t.innerHTML+=`
      <tr>
        <td>${i.id_inmueble}</td>
        <td>${i.direccion}</td>
        <td>
          <button onclick="restore(${i.id_inmueble})">Restaurar</button>
          <button onclick="purge(${i.id_inmueble})">Borrar</button>
        </td>
      </tr>`;
  });
}

async function restore(id){
  await fetch(api+"/inmuebles/"+id+"/restore",{method:"POST",headers:{Authorization:`Bearer ${token}`}});
  load();
}
async function purge(id){
  if(!confirm("Borrado definitivo")) return;
  await fetch(api+"/inmuebles/"+id+"/purge",{method:"DELETE",headers:{Authorization:`Bearer ${token}`}});
  load();
}
load();
</script>
</body>
</html>
