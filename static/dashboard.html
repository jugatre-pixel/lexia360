<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lexia360 · Panel</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css" />

  <style>
    :root{
      --bg:#f6f7fb; --card:#fff; --border:#e6e8ef; --muted:#667085; --brand:#0b5fff;
    }
    body{ background:var(--bg); margin:0; }
    header{
      position:sticky; top:0; z-index:20;
      background:rgba(246,247,251,.92);
      backdrop-filter: blur(10px);
      border-bottom:1px solid var(--border);
    }
    .wrap{ max-width:1100px; margin:0 auto; padding:14px 18px; }
    .top{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
    .brand{
      display:flex; align-items:center; gap:10px;
      text-decoration:none; color:inherit; font-weight:900;
    }
    .badge{
      width:34px;height:34px;border-radius:10px;
      background:linear-gradient(135deg,var(--brand),#5b8cff);
      display:flex;align-items:center;justify-content:center;color:#fff;
      box-shadow:0 10px 18px rgba(11,95,255,.18);
    }
    .btn{
      display:inline-flex; align-items:center; gap:8px;
      padding:10px 14px; border-radius:12px;
      border:1px solid var(--border); background:#fff;
      cursor:pointer; font-weight:800; text-decoration:none; color:inherit;
    }
    .btn.primary{ background:var(--brand); color:#fff; border-color:var(--brand); }
    .grid{ display:grid; grid-template-columns:1fr; gap:14px; margin-top:16px; }
    @media(min-width:950px){ .grid{ grid-template-columns: 1.2fr .8fr; } }
    .card{
      background:var(--card); border:1px solid var(--border);
      border-radius:16px; padding:16px;
      box-shadow:0 18px 40px rgba(16,24,40,.07);
    }
    .muted{ color:var(--muted); }
    .small{ font-size:13px; }
    .row{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
    .pill{ font-size:12px; padding:6px 10px; border-radius:999px; background:#f7f8fb; border:1px solid var(--border); }
    .list{ margin:0; padding:0; list-style:none; }
    .item{ padding:12px; border:1px solid var(--border); border-radius:14px; background:#fff; margin-bottom:10px; }
    .item a{ text-decoration:none; color:inherit; }
    .item-title{ font-weight:900; }
    .item-sub{ color:var(--muted); font-size:13px; margin-top:3px; }
  </style>
</head>

<body>
<header>
  <div class="wrap top">
    <a class="brand" href="/static/dashboard.html" title="Volver al panel">
      <div class="badge">⚖️</div>
      <div>Lexia360</div>
    </a>

    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <a class="btn" href="/static/inmuebles.html">🏠 Inmuebles</a>
      <a class="btn primary" href="/static/wizard.html">➕ Crear inmueble</a>
      <a class="btn" href="/static/papelera.html">🗑️ Papelera</a>
      <button class="btn" onclick="logout()">Cerrar sesión</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="grid">
    <section class="card">
      <div class="row">
        <div>
          <h3 style="margin:0;">Panel</h3>
          <div class="muted small">Gestiona tu cuenta y tus inmuebles</div>
        </div>
        <div class="pill" id="userPill">—</div>
      </div>

      <hr />

      <b>Últimos inmuebles</b>
      <div class="muted small" style="margin-bottom:10px;">Los 5 más recientes</div>
      <ul class="list" id="latestList"></ul>
    </section>

    <aside class="card">
      <h4 style="margin:0 0 8px;">Estado del sistema</h4>
      <div class="muted small" id="statusText">Cargando…</div>

      <hr />

      <h4 style="margin:0 0 8px;">Tu plan</h4>
      <div class="muted small" id="billingText">Cargando…</div>
    </aside>
  </div>
</main>

<script>
  const apiUrl = location.origin;
  const token = localStorage.getItem("token");
  const email = localStorage.getItem("email");

  if(!token){ window.location.href = "/static/index.html"; }

  document.getElementById("userPill").textContent = email ? `👤 ${email}` : "👤 Usuario";

  function logout(){
    localStorage.removeItem("token");
    localStorage.removeItem("email");
    window.location.href = "/static/index.html";
  }

  function escapeHtml(str){
    return String(str)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  async function loadStatus(){
    try{
      const res = await fetch(`${apiUrl}/status`);
      const data = await res.json();
      document.getElementById("statusText").innerHTML = `
        <b>${data.status || "—"}</b><br>
        Usuarios: ${data.usuarios_registrados ?? "—"}<br>
        Inmuebles: ${data.inmuebles_total ?? "—"}<br>
        Zonas tensionadas: ${data.zonas_tensionadas ?? "—"}<br>
        Versión: ${data.version ?? "—"}
      `;
    }catch(e){
      document.getElementById("statusText").textContent = "⚠️ No se pudo cargar el estado.";
    }
  }

  async function loadBilling(){
    try{
      const res = await fetch(`${apiUrl}/billing/me`, {
        headers: { "Authorization": `Bearer ${token}` }
      });
      if(!res.ok){
        document.getElementById("billingText").textContent = "Plan: Free (por ahora)";
        return;
      }
      const data = await res.json();
      document.getElementById("billingText").innerHTML = `Plan: <b>${data.plan || "free"}</b> · Pro: <b>${data.pro ? "Sí" : "No"}</b>`;
    }catch(e){
      document.getElementById("billingText").textContent = "Plan: Free (por ahora)";
    }
  }

  async function loadLatest(){
    try{
      const res = await fetch(`${apiUrl}/inmuebles`, {
        headers: { "Authorization": `Bearer ${token}` }
      });
      if(res.status === 401){ logout(); return; }
      const items = await res.json();
      const list = document.getElementById("latestList");
      list.innerHTML = "";

      (items || []).slice(0,5).forEach(i=>{
        const li = document.createElement("li");
        li.className = "item";
        li.innerHTML = `
          <a href="/static/inmueble.html?id=${i.id_inmueble}">
            <div class="item-title">${escapeHtml(i.direccion || "Inmueble")}</div>
            <div class="item-sub">${escapeHtml(i.municipio || "—")} · ${escapeHtml(i.comunidad_autonoma || "—")} · Semáforo: ${escapeHtml(i.semaforo || "—")}</div>
          </a>
        `;
        list.appendChild(li);
      });

      if((items || []).length === 0){
        list.innerHTML = `<div class="muted small">Aún no tienes inmuebles. Pulsa “Crear inmueble”.</div>`;
      }
    }catch(e){
      document.getElementById("latestList").innerHTML = `<div class="muted small">⚠️ No se pudieron cargar tus inmuebles.</div>`;
    }
  }

  loadStatus();
  loadBilling();
  loadLatest();
</script>
</body>
</html>
