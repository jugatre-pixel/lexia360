<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lexia360 · Ficha del inmueble</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css" />

  <style>
    :root{
      --bg:#f6f7fb; --card:#fff; --border:#e6e8ef; --muted:#667085;
      --brand:#0b5fff; --ok:#027a48; --bad:#b42318;
    }
    body{ background:var(--bg); margin:0; }
    header{
      position:sticky; top:0; z-index:20;
      background:rgba(246,247,251,.92);
      backdrop-filter: blur(10px);
      border-bottom:1px solid var(--border);
    }
    .wrap{ max-width:1100px; margin:0 auto; padding:14px 18px; }
    .top{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
    .brand{
      display:flex; align-items:center; gap:10px;
      text-decoration:none; color:inherit; font-weight:900;
    }
    .badge{
      width:34px;height:34px;border-radius:10px;
      background:linear-gradient(135deg,var(--brand),#5b8cff);
      display:flex;align-items:center;justify-content:center;color:#fff;
      box-shadow:0 10px 18px rgba(11,95,255,.18);
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:16px;
      padding:16px;
      box-shadow:0 18px 40px rgba(16,24,40,.07);
      margin-bottom:14px;
    }
    .row{ display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    .muted{ color:var(--muted); }
    .small{ font-size:13px; }

    .pill{
      display:inline-flex; align-items:center;
      padding:6px 12px; border-radius:999px;
      font-size:12px; font-weight:800;
      border:1px solid var(--border);
      background:#f7f8fb;
    }
    .pill.ok{ background:#ecfdf3; color:var(--ok); border-color:#abefc6; }
    .pill.bad{ background:#fef3f2; color:var(--bad); border-color:#fecdca; }

    .btn{
      display:inline-flex; align-items:center; gap:8px;
      padding:10px 14px; border-radius:12px;
      border:1px solid var(--border); background:#fff;
      cursor:pointer; font-weight:800; text-decoration:none; color:inherit;
    }
    .btn.primary{ background:var(--brand); color:#fff; border-color:var(--brand); }
  </style>
</head>

<body>
<header>
  <div class="wrap top">
    <a class="brand" href="/static/inmuebles.html">
      <div class="badge">⚖️</div>
      <div>Lexia360</div>
    </a>

    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <a class="btn" href="/static/inmuebles.html">← Inmuebles</a>
      <a class="btn" href="/static/dashboard.html">Panel</a>
      <button class="btn" onclick="logout()">Cerrar sesión</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="card">
    <div class="row">
      <div>
        <h3 style="margin:0;">Ficha legal del inmueble</h3>
        <div class="muted small" id="subTitle">—</div>
      </div>
      <div id="semaforoPill" class="pill">—</div>
    </div>
  </section>

  <section class="card">
    <h4 style="margin-top:0;">Datos del inmueble</h4>
    <div class="small" id="datos">Cargando…</div>
  </section>

  <section class="card">
    <h4 style="margin-top:0;">Resultado automático (MVP)</h4>
    <div class="small" id="resultado">Cargando…</div>
  </section>

  <section class="card">
    <h4 style="margin-top:0;">Alertas</h4>
    <div class="small" id="alertas">Cargando…</div>
  </section>

  <section class="card">
    <div class="row">
      <div class="muted small">
        Puedes descargar un informe PDF profesional con el resultado legal del inmueble.
      </div>
      <button class="btn primary" onclick="downloadPDF()">📄 Descargar informe PDF</button>
    </div>
  </section>
</main>

<script>
  const apiUrl = location.origin;
  const token = localStorage.getItem("token");

  if(!token){
    window.location.href="/static/index.html";
  }

  function logout(){
    localStorage.removeItem("token");
    localStorage.removeItem("email");
    window.location.href="/static/index.html";
  }

  function qs(name){
    return new URLSearchParams(window.location.search).get(name);
  }

  const id = qs("id");
  if(!id){
    alert("ID de inmueble no especificado");
    window.location.href="/static/inmuebles.html";
  }

  async function loadInmueble(){
    try{
      const res = await fetch(`${apiUrl}/inmuebles/${id}`, {
        headers:{ "Authorization": `Bearer ${token}` }
      });

      if(res.status === 401){ logout(); return; }
      if(!res.ok){
        alert("Inmueble no encontrado");
        window.location.href="/static/inmuebles.html";
        return;
      }

      const i = await res.json();

      document.getElementById("subTitle").textContent =
        `${i.municipio || "—"} · ${i.comunidad_autonoma || "—"}`;

      const sem = i.semaforo || "—";
      const pill = document.getElementById("semaforoPill");
      pill.textContent = sem;
      pill.className = "pill " + (sem === "VERDE" ? "ok" : (sem === "ROJO" ? "bad" : ""));

      document.getElementById("datos").innerHTML = `
        <b>Dirección:</b> ${escapeHtml(i.direccion || "—")}<br>
        <b>Municipio:</b> ${escapeHtml(i.municipio || "—")}<br>
        <b>Comunidad:</b> ${escapeHtml(i.comunidad_autonoma || "—")}<br>
        <b>Superficie:</b> ${i.superficie_m2 ?? "—"} m²<br>
        <b>Renta propuesta:</b> ${i.renta_propuesta ?? "—"} €<br>
        <b>Renta anterior:</b> ${i.renta_anterior ?? "—"} €
      `;

      document.getElementById("resultado").innerHTML = `
        <b>Zona tensionada:</b> ${i.zona_tensionada ? "Sí" : "No"}<br>
        <b>Fuente oficial:</b> ${escapeHtml(i.zona_tensionada_fuente || "—")}<br>
        <b>Fecha análisis:</b> ${escapeHtml(i.fecha_analisis || "—")}
      `;

      const alerts = i.alertas || [];
      document.getElementById("alertas").innerHTML = alerts.length
        ? alerts.map(a => `• ${escapeHtml(a)}`).join("<br>")
        : "—";

    }catch(e){
      alert("Error cargando el inmueble");
    }
  }

  function downloadPDF(){
    window.open(`${apiUrl}/inmuebles/${id}/pdf`, "_blank");
  }

  function escapeHtml(str){
    return String(str)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  loadInmueble();
</script>
</body>
</html>
