<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lexia360 · Inmuebles</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f6f7fb; --card:#fff; --border:#e6e8ef; --muted:#667085;
      --brand:#0b5fff; --brand2:#3a7bff; --text:#0b1220; --danger:#b42318;
      --shadow: 0 18px 40px rgba(16,24,40,.08); --radius:18px;
    }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial; background:var(--bg); color:var(--text); }

    header{
      position:sticky; top:0; z-index:30;
      background: rgba(246,247,251,.86);
      backdrop-filter: blur(10px);
      border-bottom:1px solid var(--border);
    }
    .wrap{ max-width:1120px; margin:0 auto; padding: 14px 18px; }
    .top{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
    .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; font-weight:900; }
    .badge{
      width:36px;height:36px;border-radius:12px;
      background: linear-gradient(135deg, var(--brand), var(--brand2));
      display:flex;align-items:center;justify-content:center;color:#fff;
      box-shadow:0 14px 26px rgba(11,95,255,.20);
    }
    .btn{
      display:inline-flex; align-items:center; justify-content:center; gap:8px;
      padding:10px 14px; border-radius:12px;
      border:1px solid var(--border); background:#fff;
      cursor:pointer; font-weight:900; text-decoration:none; color:inherit;
      transition: transform .08s ease;
      user-select:none;
      white-space:nowrap;
    }
    .btn:hover{ transform: translateY(-1px); }
    .btn.primary{ background: linear-gradient(135deg, var(--brand), var(--brand2)); color:#fff; border-color:transparent; }
    .btn.danger{ border-color:#ffd0d0; color:var(--danger); background:#fff; }

    .grid{ display:grid; grid-template-columns: 1.25fr .75fr; gap:14px; margin-top:16px; align-items:start; }
    @media(max-width: 980px){ .grid{ grid-template-columns:1fr; } }

    .card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); }
    .muted{ color:var(--muted); }
    .small{ font-size:13px; }

    .tabs{ display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
    .tab{
      padding:8px 12px;
      border:1px solid var(--border);
      border-radius:999px;
      background:#fff;
      cursor:pointer;
      font-weight:900;
    }
    .tab.active{ background: linear-gradient(135deg, var(--brand), var(--brand2)); color:#fff; border-color:transparent; }

    .list{ margin-top:12px; display:flex; flex-direction:column; gap:10px; }
    .item{ border:1px solid var(--border); border-radius:14px; background:#fff; padding:12px; }
    .title{ font-weight:900; }
    .sub{ margin-top:4px; font-size:13px; color:var(--muted); }
    .actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }

    label{ display:block; margin-top:10px; font-size:12px; font-weight:900; color:#374151; }
    input, select{
      width:100%;
      padding:12px 12px;
      border-radius:12px;
      border:1px solid var(--border);
      outline:none;
      font-size:14px;
      margin-top:6px;
      background:#fff;
    }
    input:focus{ border-color: rgba(11,95,255,.35); box-shadow: 0 0 0 4px rgba(11,95,255,.10); }

    .toast{
      position: fixed;
      right: 16px;
      bottom: 16px;
      background:#0b1220;
      color:#fff;
      border:1px solid rgba(255,255,255,.14);
      border-radius:14px;
      padding:12px 12px;
      box-shadow: 0 18px 45px rgba(16,24,40,.25);
      display:none;
      max-width: 360px;
      z-index: 100;
    }
    .toast b{ display:block; margin-bottom:3px; }
    .toast .row{ display:flex; gap:10px; margin-top:10px; }
    .toast .tbtn{
      flex:1;
      padding:9px 10px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.08);
      color:#fff;
      font-weight:900;
      cursor:pointer;
    }
    .toast .tbtn.primary{
      background: linear-gradient(135deg, var(--brand), var(--brand2));
      border-color: transparent;
    }
  </style>
</head>

<body>
<header>
  <div class="wrap top">
    <a class="brand" href="/static/dashboard.html">
      <div class="badge">⚖️</div>
      <div>Lexia360</div>
    </a>

    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <a class="btn" href="/static/dashboard.html">← Panel</a>
      <a class="btn" href="/static/wizard.html">➕ Crear perfil</a>
      <a class="btn" href="/static/papelera.html">🗑️ Papelera</a>
      <button class="btn" onclick="logout()">Cerrar sesión</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="grid">
    <section class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">
        <div>
          <h2 style="margin:0;">Inmuebles</h2>
          <div class="muted small">Activos y Papelera. Restauración y borrado definitivo.</div>
        </div>
        <button class="btn" onclick="loadList()">🔄 Actualizar</button>
      </div>

      <div class="tabs">
        <button class="tab active" id="tabActivos" onclick="setTab('activos')">Activos <span id="countActivos"></span></button>
        <button class="tab" id="tabPapelera" onclick="setTab('papelera')">Papelera <span id="countTrash"></span></button>
      </div>

      <div id="list" class="list"></div>
      <div id="empty" class="muted small" style="margin-top:10px; display:none;">No hay inmuebles aquí.</div>
    </section>

    <aside class="card">
      <h3 style="margin:0 0 8px;">Crear inmueble rápido</h3>
      <div class="muted small">Para una experiencia más “LegalZoom”, usa el wizard. Esto es un atajo.</div>

      <label>Dirección</label>
      <input id="dir" type="text" placeholder="Calle, número, piso…" />

      <label>Municipio</label>
      <input id="mun" type="text" placeholder="Madrid, Barcelona…" />

      <label>Comunidad Autónoma</label>
      <input id="ca" type="text" placeholder="Comunidad de Madrid…" />

      <label>Renta propuesta (€)</label>
      <input id="renta" type="number" step="0.01" placeholder="1200" />

      <label>Renta anterior (€) (opcional)</label>
      <input id="rentaAnt" type="number" step="0.01" placeholder="1100" />

      <button class="btn primary" style="width:100%; margin-top:12px;" onclick="createInmueble()">+ Crear</button>
      <div id="msg" class="muted small" style="margin-top:10px;"></div>
    </aside>
  </div>
</main>

<div class="toast" id="toast">
  <b id="toastTitle">—</b>
  <div class="small" id="toastText">—</div>
  <div class="row">
    <button class="tbtn" onclick="hideToast()">Cerrar</button>
    <button class="tbtn primary" onclick="goTrash()">Ver Papelera</button>
  </div>
</div>

<script>
  const apiUrl = location.origin;
  const token = localStorage.getItem("token");

  if(!token){ window.location.href="/static/index.html"; }

  let currentTab = "activos";

  function logout(){
    localStorage.removeItem("token");
    localStorage.removeItem("email");
    window.location.href="/static/index.html";
  }

  function escapeHtml(str){
    return String(str)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function setTab(tab){
    currentTab = tab;
    document.getElementById("tabActivos").classList.toggle("active", tab === "activos");
    document.getElementById("tabPapelera").classList.toggle("active", tab === "papelera");
    loadList();
  }

  function showToast(title, text){
    const t = document.getElementById("toast");
    document.getElementById("toastTitle").textContent = title;
    document.getElementById("toastText").textContent = text;
    t.style.display = "block";
  }
  function hideToast(){ document.getElementById("toast").style.display = "none"; }
  function goTrash(){ hideToast(); setTab("papelera"); }

  async function loadCounters(){
    try{
      const [a, tr] = await Promise.all([
        fetch(`${apiUrl}/inmuebles`, { headers:{ "Authorization": `Bearer ${token}` }}),
        fetch(`${apiUrl}/inmuebles/trash`, { headers:{ "Authorization": `Bearer ${token}` }})
      ]);
      if(a.status===401 || tr.status===401){ logout(); return; }
      const activos = await a.json().catch(()=>[]);
      const trash = await tr.json().catch(()=>[]);
      document.getElementById("countActivos").textContent = `(${(activos||[]).length})`;
      document.getElementById("countTrash").textContent = `(${(trash||[]).length})`;
    }catch(e){
      document.getElementById("countActivos").textContent = "";
      document.getElementById("countTrash").textContent = "";
    }
  }

  async function loadList(){
    const list = document.getElementById("list");
    const empty = document.getElementById("empty");
    list.innerHTML = `<div class="muted small">Cargando…</div>`;
    empty.style.display = "none";

    const endpoint = currentTab === "activos" ? "/inmuebles" : "/inmuebles/trash";

    try{
      const res = await fetch(`${apiUrl}${endpoint}`, {
        headers: { "Authorization": `Bearer ${token}` }
      });
      if(res.status === 401){ logout(); return; }
      const items = await res.json().catch(()=>[]);

      list.innerHTML = "";
      if(!Array.isArray(items) || items.length === 0){
        empty.style.display = "block";
        await loadCounters();
        return;
      }

      items.forEach(i=>{
        const el = document.createElement("div");
        el.className = "item";
        el.innerHTML = `
          <div class="title">${escapeHtml(i.direccion || "Inmueble")}</div>
          <div class="sub">
            ${escapeHtml(i.municipio || "—")} · ${escapeHtml(i.comunidad_autonoma || "—")}
            · Semáforo: <b>${escapeHtml(i.semaforo || "—")}</b>
            ${i.zona_tensionada ? " · Zona tensionada: Sí" : ""}
          </div>

          <div class="actions">
            ${currentTab === "activos"
              ? `
                <a class="btn" href="/static/inmueble.html?id=${i.id_inmueble}">Abrir ficha</a>
                <button class="btn danger" onclick="softDelete(${i.id_inmueble})">Mover a papelera</button>
              `
              : `
                <button class="btn" onclick="restore(${i.id_inmueble})">Restaurar</button>
                <button class="btn danger" onclick="purge(${i.id_inmueble})">Borrado definitivo</button>
              `
            }
          </div>
        `;
        list.appendChild(el);
      });

      await loadCounters();
    }catch(e){
      list.innerHTML = `<div class="muted small">⚠️ No se pudo cargar la lista.</div>`;
    }
  }

  async function createInmueble(){
    const msg = document.getElementById("msg");
    msg.textContent = "Creando…";

    const payload = {
      direccion: document.getElementById("dir").value.trim(),
      municipio: document.getElementById("mun").value.trim(),
      comunidad_autonoma: document.getElementById("ca").value.trim(),
      renta_propuesta: Number(document.getElementById("renta").value),
      renta_anterior: document.getElementById("rentaAnt").value ? Number(document.getElementById("rentaAnt").value) : null
    };

    if(!payload.direccion || !payload.municipio || !payload.comunidad_autonoma || !payload.renta_propuesta){
      msg.textContent = "⚠️ Rellena dirección, municipio, comunidad y renta.";
      return;
    }

    try{
      const res = await fetch(`${apiUrl}/inmuebles`, {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify(payload)
      });

      const data = await res.json().catch(()=>({}));
      if(!res.ok){
        msg.textContent = data.detail || "Error creando inmueble.";
        return;
      }

      msg.textContent = "✅ Inmueble creado.";
      document.getElementById("dir").value = "";
      document.getElementById("mun").value = "";
      document.getElementById("ca").value = "";
      document.getElementById("renta").value = "";
      document.getElementById("rentaAnt").value = "";

      setTab("activos");
      await loadList();
      await loadCounters();
    }catch(e){
      msg.textContent = "⚠️ No se pudo crear.";
    }
  }

  // ✅ FIX UX: al borrar -> cambia a Papelera automáticamente
  async function softDelete(id){
    if(!confirm("¿Mover a papelera? Podrás restaurarlo.")) return;

    try{
      const res = await fetch(`${apiUrl}/inmuebles/${id}`, {
        method:"DELETE",
        headers:{ "Authorization": `Bearer ${token}` }
      });
      if(res.status === 401){ logout(); return; }
      const data = await res.json().catch(()=>({}));
      if(!res.ok){
        alert(data.detail || "Error moviendo a papelera");
        return;
      }

      // ✅ Cambia a papelera y recarga: así lo ves “moverse”
      showToast("Movido a Papelera", "Puedes restaurarlo o borrarlo definitivamente desde la Papelera.");
      setTab("papelera");
      await loadList();
    }catch(e){
      alert("Error de conexión");
    }
  }

  async function restore(id){
    if(!confirm("¿Restaurar este inmueble a Activos?")) return;

    const res = await fetch(`${apiUrl}/inmuebles/${id}/restore`, {
      method:"POST",
      headers:{ "Authorization": `Bearer ${token}` }
    });

    if(res.status === 401){ logout(); return; }

    const data = await res.json().catch(()=>({}));
    if(!res.ok){
      alert(data.detail || "Error restaurando");
      return;
    }

    showToast("Restaurado", "El inmueble ha vuelto a Activos.");
    setTab("activos");
    await loadList();
  }

  async function purge(id){
    if(!confirm("⚠️ Esto borra DEFINITIVAMENTE el inmueble y su historial. ¿Continuar?")) return;

    const res = await fetch(`${apiUrl}/inmuebles/${id}/purge`, {
      method:"DELETE",
      headers:{ "Authorization": `Bearer ${token}` }
    });

    if(res.status === 401){ logout(); return; }

    const data = await res.json().catch(()=>({}));
    if(!res.ok){
      alert(data.detail || "Error borrando definitivo");
      return;
    }

    showToast("Borrado definitivo", "Se ha eliminado el inmueble y su historial.");
    await loadList();
  }

  loadCounters();
  loadList();
</script>
</body>
</html>
