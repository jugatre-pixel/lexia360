<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lexia360 · Ficha de inmueble</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css" />
  <style>
    :root{ --bg:#f6f7fb; --card:#fff; --border:#e6e8ef; --muted:#667085; --brand:#0b5fff; --danger:#b42318; }
    body{ background:var(--bg); margin:0; }
    header{ position:sticky; top:0; z-index:20; background:rgba(246,247,251,.92); backdrop-filter: blur(10px); border-bottom:1px solid var(--border); }
    .wrap{ max-width:1100px; margin:0 auto; padding:14px 18px; }
    .top{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
    .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; font-weight:900; }
    .badge{ width:34px;height:34px;border-radius:10px; background:linear-gradient(135deg,var(--brand),#5b8cff); display:flex;align-items:center;justify-content:center;color:#fff; box-shadow:0 10px 18px rgba(11,95,255,.18); }
    .btn{ display:inline-flex; align-items:center; gap:8px; padding:10px 14px; border-radius:12px; border:1px solid var(--border); background:#fff; cursor:pointer; font-weight:800; text-decoration:none; color:inherit; }
    .btn.primary{ background:var(--brand); color:#fff; border-color:var(--brand); }
    .btn.danger{ border-color:#ffd0d0; color:var(--danger); }
    .card{ background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; box-shadow:0 18px 40px rgba(16,24,40,.07); margin-top:16px; }
    .muted{ color:var(--muted); }
    .small{ font-size:13px; }
    .pill{ display:inline-block; font-size:12px; padding:6px 10px; border-radius:999px; background:#f7f8fb; border:1px solid var(--border); margin-right:6px; }
    ul{ margin:10px 0 0; }
  </style>
</head>

<body>
<header>
  <div class="wrap top">
    <a class="brand" href="/static/dashboard.html">
      <div class="badge">⚖️</div>
      <div>Lexia360</div>
    </a>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <a class="btn" href="/static/inmuebles.html">← Inmuebles</a>
      <button class="btn primary" onclick="downloadPdf()">📄 Descargar PDF</button>
      <button class="btn" onclick="logout()">Cerrar sesión</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="card">
    <h3 style="margin:0 0 6px;">Ficha del inmueble</h3>
    <div class="muted small" id="subtitle">Cargando…</div>

    <div style="margin-top:10px;">
      <span class="pill" id="pillSem">Semáforo: —</span>
      <span class="pill" id="pillZona">Zona: —</span>
      <span class="pill" id="pillFecha">Análisis: —</span>
    </div>

    <hr />

    <div id="details" class="small muted">—</div>

    <h4 style="margin-top:14px;">Alertas</h4>
    <div id="alerts" class="small">—</div>
  </section>
</main>

<script>
  const apiUrl = location.origin;
  const token = localStorage.getItem("token");
  if(!token){ window.location.href="/static/index.html"; }

  function logout(){
    localStorage.removeItem("token");
    localStorage.removeItem("email");
    window.location.href="/static/index.html";
  }

  function escapeHtml(str){
    return String(str)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  const params = new URLSearchParams(location.search);
  const id = params.get("id");

  async function load(){
    if(!id){ document.getElementById("subtitle").textContent = "ID inválido."; return; }

    const res = await fetch(`${apiUrl}/inmuebles/${id}`, { headers:{ "Authorization": `Bearer ${token}` } });
    if(res.status === 401){ logout(); return; }
    const data = await res.json().catch(()=>({}));
    if(!res.ok){
      document.getElementById("subtitle").textContent = data.detail || "No se pudo cargar.";
      return;
    }

    document.getElementById("subtitle").textContent =
      `${data.direccion} · ${data.municipio}, ${data.comunidad_autonoma} · ID ${data.id_inmueble}`;

    document.getElementById("pillSem").textContent = `Semáforo: ${data.semaforo || "—"}`;
    document.getElementById("pillZona").textContent = `Zona: ${data.zona_tensionada ? "Sí" : "No"}`;
    document.getElementById("pillFecha").textContent = `Análisis: ${data.fecha_analisis || "—"}`;

    const d = `
      <b>Dirección:</b> ${escapeHtml(data.direccion || "—")}<br>
      <b>Municipio:</b> ${escapeHtml(data.municipio || "—")}<br>
      <b>Comunidad:</b> ${escapeHtml(data.comunidad_autonoma || "—")}<br>
      <b>CP:</b> ${escapeHtml(data.codigo_postal || "—")}<br>
      <b>Superficie:</b> ${escapeHtml(String(data.superficie_m2 ?? "—"))} m²<br>
      <b>Tipo arrendador:</b> ${escapeHtml(data.tipo_arrendador || "—")}<br>
      <b>Renta propuesta:</b> ${escapeHtml(String(data.renta_propuesta ?? "—"))} €<br>
      <b>Renta anterior:</b> ${data.renta_anterior == null ? "—" : escapeHtml(String(data.renta_anterior)) + " €"}<br>
      ${data.zona_tensionada_fuente ? `<b>Fuente zona tensionada:</b> ${escapeHtml(data.zona_tensionada_fuente)}<br>` : ""}
    `;
    document.getElementById("details").innerHTML = d;

    const alerts = (data.alertas || []);
    document.getElementById("alerts").innerHTML = alerts.length
      ? `<ul>${alerts.map(a=>`<li>${escapeHtml(a)}</li>`).join("")}</ul>`
      : `<div class="muted small">Sin alertas.</div>`;
  }

  async function downloadPdf(){
    if(!id) return;
    const res = await fetch(`${apiUrl}/inmuebles/${id}/pdf`, { headers:{ "Authorization": `Bearer ${token}` } });
    if(res.status === 401){ logout(); return; }
    if(!res.ok){
      const data = await res.json().catch(()=>({}));
      alert(data.detail || "No se pudo generar el PDF.");
      return;
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `lexia360_informe_inmueble_${id}.pdf`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  load();
</script>
</body>
</html>
