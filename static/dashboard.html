<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Lexia360 · Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css"/>
</head>
<body>
<nav class="container-fluid">
  <ul>
    <li><strong>⚖️ Lexia360</strong></li>
  </ul>
  <ul>
    <li><a href="/static/inmuebles.html">Inmuebles</a></li>
    <li><a href="/static/papelera.html">Papelera</a></li>
    <li><a href="/static/wizard.html">Nuevo</a></li>
    <li><a href="#" onclick="logout()">Salir</a></li>
  </ul>
</nav>

<main class="container">
  <h2>Panel de control</h2>
  <p id="who"></p>

  <article>
    <ul>
      <li>Usuarios registrados: <b id="k_users">—</b></li>
      <li>Versión sistema: <b id="k_version">—</b></li>
    </ul>
  </article>
</main>

<script>
const api = location.origin;
const token = localStorage.getItem("token");
if(!token) location.href="/static/index.html";

function logout(){
  localStorage.clear();
  location.href="/static/index.html";
}

async function init(){
  const me = await fetch(api+"/me",{headers:{Authorization:`Bearer ${token}`}});
  if(me.status===401) return logout();
  const u = await me.json();
  document.getElementById("who").textContent = "Usuario: "+u.email;

  const st = await fetch(api+"/status");
  const s = await st.json();
  document.getElementById("k_users").textContent = s.usuarios_registrados;
  document.getElementById("k_version").textContent = s.version;
}
init();
</script>
</body>
</html>
