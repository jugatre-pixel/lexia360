<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lexia360 · Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css" />
  <style>
    :root{
      --brand:#0b5fff; --brand2:#5b8cff;
      --bg:#0b1220; --muted:rgba(255,255,255,.74);
      --card:#fff; --border:#e6e8ef;
      --ink:#101828;
    }
    body{
      margin:0;
      background:
        radial-gradient(1000px 520px at 20% 0%, rgba(11,95,255,.22), transparent 55%),
        radial-gradient(900px 520px at 90% 10%, rgba(91,140,255,.18), transparent 60%),
        linear-gradient(180deg, #0b1220 0%, #0f1a33 46%, #f6f7fb 46%, #f6f7fb 100%);
    }
    .wrap{ max-width:1150px; margin:0 auto; padding:18px; }
    .nav{
      position:sticky; top:0; z-index:20;
      background:rgba(11,18,32,.55);
      backdrop-filter: blur(12px);
      border-bottom:1px solid rgba(255,255,255,.10);
    }
    .nav-row{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
    .logo{ display:flex; align-items:center; gap:10px; color:#fff; text-decoration:none; font-weight:900; letter-spacing:.2px; }
    .badge{ width:36px; height:36px; border-radius:12px; display:flex; align-items:center; justify-content:center;
      background:linear-gradient(135deg,var(--brand),var(--brand2));
      box-shadow:0 14px 28px rgba(11,95,255,.22);
    }
    .nav-actions{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .btn{
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.06);
      color:#fff; padding:10px 14px; border-radius:12px; font-weight:900; cursor:pointer;
    }
    .btn.primary{ background:linear-gradient(135deg,var(--brand),var(--brand2)); border-color:transparent; }
    .hero{ padding:22px 0 12px; }
    .headline{ color:#fff; font-size:34px; line-height:1.06; margin:0 0 8px; font-weight:1000; letter-spacing:-.2px; }
    .sub{ color:var(--muted); margin:0; font-size:14px; }
    .grid{ display:grid; grid-template-columns: 1.25fr .75fr; gap:14px; align-items:start; }
    @media(max-width:900px){ .grid{ grid-template-columns:1fr; } }
    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:16px;
      padding:16px;
      box-shadow:0 18px 44px rgba(16,24,40,.12);
    }
    .kpis{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
    @media(max-width:900px){ .kpis{ grid-template-columns:repeat(2,1fr); } }
    .kpi{ border:1px solid var(--border); border-radius:14px; padding:12px; background:#fff; }
    .kpi .label{ color:#667085; font-size:12px; font-weight:900; margin-bottom:6px; }
    .kpi .value{ font-size:22px; font-weight:1000; color:var(--ink); }
    .muted2{ color:#667085; font-size:13px; }
    .msg{ margin-top:10px; font-size:13px; font-weight:900; }
    .msg.error{ color:#b42318; }
    .msg.ok{ color:#027a48; }
  </style>
</head>
<body>
  <div class="nav">
    <div class="wrap nav-row">
      <a class="logo" href="/static/dashboard.html">
        <div class="badge">⚖️</div>
        <div>Lexia360</div>
      </a>
      <div class="nav-actions">
        <span id="who" style="color:rgba(255,255,255,.85); font-weight:900;"></span>
        <button class="btn" onclick="go('/static/wizard.html')">Wizard</button>
        <button class="btn" onclick="go('/static/wizard_lease.html')">Contrato</button>
        <button class="btn" onclick="go('/static/inmuebles.html')">Inmuebles</button>
        <button class="btn" onclick="go('/static/documentos.html')">Documentos</button>
        <button class="btn" onclick="go('/static/papelera.html')">Papelera</button>
        <button class="btn primary" onclick="logout()">Salir</button>
      </div>
    </div>
  </div>

  <section class="wrap hero">
    <h1 class="headline">Panel de control</h1>
    <p class="sub">Centro de operaciones: expedientes, documentos y trazabilidad.</p>
  </section>

  <section class="wrap">
    <div class="grid">
      <div class="card">
        <h3 style="margin:0 0 10px;">Estado</h3>

        <div class="kpis">
          <div class="kpi"><div class="label">Usuarios</div><div class="value" id="k_users">—</div></div>
          <div class="kpi"><div class="label">Inmuebles</div><div class="value" id="k_inm">—</div></div>
          <div class="kpi"><div class="label">Papelera</div><div class="value" id="k_trash">—</div></div>
          <div class="kpi"><div class="label">Docs</div><div class="value" id="k_docs">—</div></div>
        </div>

        <div id="sysMsg" class="msg"></div>
      </div>

      <div class="card">
        <h3 style="margin:0 0 10px;">Atajos</h3>
        <div class="muted2" style="margin-bottom:10px;">Acciones rápidas.</div>

        <button class="btn primary" style="width:100%;margin-bottom:10px;" onclick="go('/static/wizard_lease.html')">Generar contrato (Lease)</button>
        <button class="btn" style="width:100%;margin-bottom:10px;" onclick="go('/static/inmuebles.html')">Gestionar inmuebles</button>
        <button class="btn" style="width:100%;margin-bottom:10px;" onclick="go('/static/documentos.html')">Ver documentos</button>
        <button class="btn" style="width:100%;" onclick="go('/static/papelera.html')">Ver papelera</button>
      </div>
    </div>
  </section>

<script>
  const apiUrl = location.origin;

  function token(){ return localStorage.getItem("token"); }
  function authHeaders(){ return { "Authorization": `Bearer ${token()}` }; }
  function go(path){ window.location.href = path; }
  function logout(){
    localStorage.removeItem("token");
    localStorage.removeItem("email");
    window.location.href="/static/index.html";
  }
  function setText(id, v){ document.getElementById(id).textContent = (v ?? "—"); }

  async function guard(){
    const t = token();
    if(!t){ logout(); return false; }
    const res = await fetch(`${apiUrl}/me`, { headers: authHeaders() });
    if(res.status === 401){ logout(); return false; }
    if(!res.ok){ return false; }
    const me = await res.json().catch(()=>null);
    document.getElementById("who").textContent = me?.email || localStorage.getItem("email") || "";
    return true;
  }

  async function loadStatus(){
    const msg = document.getElementById("sysMsg");
    msg.textContent = "";
    try{
      const res = await fetch(`${apiUrl}/status`, { headers: authHeaders() });
      if(res.status===401){ logout(); return; }
      const data = await res.json().catch(()=>null);

      setText("k_users", data?.usuarios_registrados ?? "—");
      setText("k_inm", data?.inmuebles_activos ?? "—");
      setText("k_trash", data?.inmuebles_eliminados ?? "—");
      setText("k_docs", data?.documentos ?? "—");

      msg.className = "msg ok";
      msg.textContent = "✅ Estado cargado.";
      setTimeout(()=>{ msg.textContent=""; }, 900);
    }catch(e){
      msg.className = "msg error";
      msg.textContent = "⚠️ No se pudo cargar /status.";
    }
  }

  (async function init(){
    const ok = await guard();
    if(!ok) return;
    await loadStatus();
  })();
</script>
</body>
</html>
