<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lexia360 • Panel</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css" />

  <style>
    :root{
      --bg:#F6F8FB;
      --card:#FFFFFF;
      --text:#0B1220;
      --muted:#5B677A;
      --border:#E6EAF2;
      --primary:#1E4FD6;
      --primaryHover:#1A43B7;
      --radius:16px;

      --okBg:#E8F5E9;
      --okText:#2E7D32;
      --badBg:#FFEBEE;
      --badText:#C62828;
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;
    }

    .wrap{
      max-width:1180px;
      margin:0 auto;
      padding:0 18px;
    }

    /* ✅ HEADER NORMAL (NO FIJO) */
    header{
      position: static;
      background:#fff;
      border-bottom:1px solid var(--border);
    }

    .nav{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:14px 0;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:800;
    }

    .logo{
      width:34px;
      height:34px;
      border-radius:10px;
      background:linear-gradient(135deg,var(--primary),#6D8BFF);
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
    }

    .right{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }

    .chip{
      background:#F1F4FA;
      border:1px solid var(--border);
      padding:8px 12px;
      border-radius:999px;
      font-weight:700;
      font-size:13px;
      color:var(--muted);
    }

    .btn{
      padding:10px 14px;
      border-radius:12px;
      border:1px solid var(--border);
      background:#fff;
      font-weight:800;
      cursor:pointer;
    }

    .btn.primary{
      background:var(--primary);
      color:#fff;
      border-color:var(--primary);
    }

    .btn.primary:hover{
      background:var(--primaryHover);
    }

    .btn.danger{
      color:var(--badText);
      border-color:rgba(198,40,40,.4);
    }

    main{
      padding:26px 0 40px;
    }

    h1{ margin:0; font-size:26px; }
    .sub{ color:var(--muted); margin-top:6px; }

    .grid{
      display:grid;
      grid-template-columns:420px 1fr;
      gap:16px;
      margin-top:18px;
      align-items:start;
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:18px;
      box-shadow:0 8px 20px rgba(11,18,32,.05);
    }

    .card h2{ font-size:16px; margin:0 0 10px; }

    label{
      font-weight:700;
      font-size:13px;
      color:var(--muted);
    }

    input, select{
      background:#fff !important;
      border-radius:12px !important;
      border:1px solid var(--border) !important;
    }

    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .status{
      display:inline-block;
      padding:6px 10px;
      border-radius:999px;
      font-weight:800;
      font-size:12px;
    }

    .ok{ background:var(--okBg); color:var(--okText); }
    .bad{ background:var(--badBg); color:var(--badText); }

    table{
      width:100%;
      border-collapse:separate;
      border-spacing:0;
      border-radius:14px;
      overflow:hidden;
      border:1px solid var(--border);
    }

    th, td{
      padding:12px;
      font-size:13px;
      border-bottom:1px solid var(--border);
      background:#fff;
      vertical-align:top;
    }

    th{
      background:#FBFCFF;
      font-weight:800;
      color:var(--muted);
    }

    tr:last-child td{ border-bottom:none; }

    .addr{ font-weight:800; }

    details{
      border:1px solid var(--border);
      border-radius:12px;
      padding:10px;
      margin-top:8px;
      background:#fff;
    }

    summary{ font-weight:800; cursor:pointer; }

    .alert{
      font-size:13px;
      color:var(--muted);
      border-left:3px solid var(--border);
      padding-left:10px;
      margin-top:6px;
    }

    .msg{
      margin-top:10px;
      font-weight:800;
      font-size:13px;
    }

    @media(max-width:980px){
      .grid{ grid-template-columns:1fr; }
    }
  </style>
</head>

<body>
<header>
  <div class="wrap nav">
    <div class="brand">
      <div class="logo">⚖</div>
      <span>Lexia360</span>
    </div>
    <div class="right">
      <span class="chip" id="userChip">Cargando…</span>
      <a class="btn" href="/static/index.html">Inicio</a>
      <button class="btn danger" onclick="logout()">Cerrar sesión</button>
    </div>
  </div>
</header>

<main class="wrap">
  <h1>Panel de control</h1>
  <p class="sub">Alta de inmuebles y validación legal automática.</p>

  <div class="grid">
    <!-- FORMULARIO -->
    <section class="card">
      <h2>Nuevo inmueble</h2>

      <label>Dirección</label>
      <input id="direccion" />

      <div class="row">
        <div>
          <label>Municipio</label>
          <input id="municipio" />
        </div>
        <div>
          <label>Comunidad Autónoma</label>
          <input id="comunidad" />
        </div>
      </div>

      <div class="row">
        <div>
          <label>Renta propuesta (€)</label>
          <input id="renta" type="number" />
        </div>
        <div>
          <label>Renta anterior</label>
          <input id="rentaAnterior" type="number" />
        </div>
      </div>

      <button class="btn primary" style="width:100%;margin-top:12px" onclick="crearInmueble()">
        Guardar inmueble
      </button>

      <div id="formMsg" class="msg"></div>
    </section>

    <!-- LISTA -->
    <section class="card">
      <h2>Mis inmuebles</h2>
      <table>
        <thead>
          <tr>
            <th>Dirección</th>
            <th>Renta</th>
            <th>Estado</th>
            <th>Detalle</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="4">Cargando…</td></tr>
        </tbody>
      </table>
    </section>
  </div>
</main>

<script>
const api = window.location.origin;

function logout(){
  localStorage.removeItem("token");
  location.href="/static/index.html";
}

function token(){
  return localStorage.getItem("token");
}

async function request(path, options={}){
  options.headers = options.headers || {};
  options.headers.Authorization = `Bearer ${token()}`;
  const res = await fetch(api+path, options);
  const data = await res.json();
  return {res,data};
}

async function cargarUsuario(){
  const {data} = await request("/me");
  document.getElementById("userChip").textContent = data.email;
}

async function cargarInmuebles(){
  const {data} = await request("/inmuebles");
  const rows = document.getElementById("rows");
  if(!data.length){
    rows.innerHTML="<tr><td colspan='4'>Sin inmuebles</td></tr>";
    return;
  }
  rows.innerHTML = data.map(i=>`
    <tr>
      <td class="addr">${i.direccion}</td>
      <td>${i.renta_propuesta}€</td>
      <td>${i.semaforo==="VERDE" ? "<span class='status ok'>VERDE</span>" : "<span class='status bad'>ROJO</span>"}</td>
      <td>
        <details>
          <summary>Ver</summary>
          ${(i.alertas||[]).map(a=>`<div class="alert">${a}</div>`).join("")}
        </details>
      </td>
    </tr>
  `).join("");
}

async function crearInmueble(){
  const msg=document.getElementById("formMsg");
  msg.textContent="";
  const payload={
    direccion:direccion.value,
    municipio:municipio.value,
    comunidad_autonoma:comunidad.value,
    renta_propuesta:Number(renta.value),
    renta_anterior:Number(rentaAnterior.value)||null,
    tipo_arrendamiento:"vivienda_habitual",
    tipo_arrendador:"persona_fisica"
  };
  const {res,data}=await request("/inmuebles",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
  if(!res.ok){ msg.textContent=data.detail||"Error"; return;}
  msg.style.color="green"; msg.textContent="Inmueble creado";
  cargarInmuebles();
}

(async()=>{
  await cargarUsuario();
  await cargarInmuebles();
})();
</script>
</body>
</html>
