<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lexia360 · Panel</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css" />

  <style>
    :root{
      --accent:#0b5fff;
      --muted:#667085;
      --bg:#f6f7fb;
      --card:#ffffff;
      --border:#e6e8ef;
      --danger:#b42318;
    }

    body{ background: var(--bg); }

    header{
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(246,247,251,0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .wrap{ max-width: 1100px; margin: 0 auto; padding: 18px; }
    .topbar{ display:flex; align-items:center; justify-content:space-between; gap: 12px; }

    .brand{ display:flex; align-items:center; gap: 10px; }

    .btn{
      display:inline-flex; align-items:center; gap:8px;
      padding:10px 14px; border-radius:10px;
      border:1px solid var(--border); background:#fff;
      cursor:pointer; text-decoration:none; font-weight: 700; white-space: nowrap;
    }

    .btn.primary{ background: var(--accent); color:#fff; border-color: var(--accent); }
    .btn.danger{ border-color:#ffb3b3; color: var(--danger); }

    .muted{ color: var(--muted); }
    .small{ font-size: 13px; }

    .card{
      background: var(--card);
      border:1px solid var(--border);
      border-radius:14px;
      padding:16px;
      box-shadow: 0 8px 18px rgba(16,24,40,0.04);
    }

    .list{ display:flex; flex-direction:column; gap: 12px; margin-top: 12px; }

    .row{
      display:flex; justify-content:space-between; gap: 14px; align-items:flex-start;
      padding: 14px; border: 1px solid var(--border); border-radius: 14px; background: #fff;
    }

    .row h4{ margin:0 0 6px 0; font-size: 16px; }

    .meta{ display:flex; flex-wrap:wrap; gap: 8px 14px; }

    .pill{ font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); background: #fafafa; }
    .pill.green{ border-color:#b7ebc6; background:#f0fff4; }
    .pill.red{ border-color:#ffc4c4; background:#fff5f5; }
    .pill.gray{ border-color: var(--border); background:#f8fafc; }

    .actions{ display:flex; gap: 10px; flex-wrap:wrap; justify-content:flex-end; min-width: 320px; }

    footer{ text-align:center; padding: 18px 0 40px; color: var(--muted); font-size: 13px; }
  </style>
</head>

<body>
<header>
  <div class="wrap topbar">
    <div class="brand">
      <div style="font-size:20px">⚖️</div>
      <div>
        <b>Lexia360</b>
        <div class="muted small">Panel de inmuebles</div>
      </div>
    </div>

    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
      <a class="btn" href="/static/papelera.html">🗑️ Papelera</a>
      <a class="btn primary" href="/static/wizard.html">➕ Crear inmueble</a>
      <button class="btn" onclick="logout()">Cerrar sesión</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="card">
    <h3 style="margin:0 0 6px;">Hola, <span id="userEmail"></span> 👋</h3>
    <div class="muted small">Gestiona tus inmuebles y revisa su estado legal en un clic.</div>
    <div id="statusLine" class="small muted" style="margin-top:10px;"></div>
  </section>

  <section class="card" style="margin-top:14px;">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
      <div>
        <h3 style="margin:0 0 6px;">Tus inmuebles</h3>
        <div class="muted small">Ver ficha, alertas y semáforo.</div>
      </div>
      <button class="btn" onclick="loadInmuebles()">🔄 Actualizar</button>
    </div>

    <div id="list" class="list"></div>
    <div id="empty" class="muted small" style="margin-top:12px; display:none;">
      Aún no tienes inmuebles. Pulsa <b>“Crear inmueble”</b> para empezar.
    </div>
  </section>
</main>

<footer>© 2026 Lexia360</footer>

<script>
  const apiUrl = location.origin;
  const token = localStorage.getItem("token");
  const userEmail = localStorage.getItem("email");
  document.getElementById("userEmail").textContent = userEmail || "Usuario";

  function logout(){
    localStorage.removeItem("token");
    localStorage.removeItem("email");
    window.location.href = "/static/index.html";
  }

  function semaforoPill(semaforo){
    if(semaforo === "ROJO") return `<span class="pill red">🔴 Riesgo</span>`;
    if(semaforo === "VERDE") return `<span class="pill green">🟢 OK</span>`;
    return `<span class="pill gray">—</span>`;
  }

  function escapeHtml(str){
    return String(str)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  async function loadStatus(){
    const el = document.getElementById("statusLine");
    try{
      const res = await fetch(`${apiUrl}/status`);
      const data = await res.json();
      el.textContent = `Servidor: ${data.status} · Usuarios: ${data.usuarios_registrados} · Zonas: ${data.zonas_tensionadas ?? 0} · ${data.version}`;
    }catch(e){
      el.textContent = "Servidor: ⚠️ no disponible";
    }
  }

  async function loadInmuebles(){
    if(!token){ logout(); return; }

    const list = document.getElementById("list");
    const empty = document.getElementById("empty");
    list.innerHTML = `<div class="muted small">Cargando…</div>`;
    empty.style.display = "none";

    try{
      const res = await fetch(`${apiUrl}/inmuebles`, {
        headers: { "Authorization": `Bearer ${token}` }
      });
      if(res.status === 401){ logout(); return; }
      const items = await res.json();

      if(!Array.isArray(items) || items.length === 0){
        list.innerHTML = "";
        empty.style.display = "block";
        return;
      }

      list.innerHTML = items.map(inm => `
        <div class="row">
          <div style="flex:1;">
            <h4>${escapeHtml(inm.direccion || "Sin dirección")}</h4>
            <div class="meta">
              <span class="pill gray">${escapeHtml(inm.municipio || "—")}</span>
              <span class="pill gray">${escapeHtml(inm.comunidad_autonoma || "—")}</span>
              ${semaforoPill(inm.semaforo)}
              <span class="pill gray">Análisis: ${escapeHtml(inm.fecha_analisis || "—")}</span>
              <span class="pill gray">Zona: ${inm.zona_tensionada ? "Sí" : "No"}</span>
            </div>
            ${inm.zona_tensionada_fuente ? `<div class="muted small" style="margin-top:8px;">Fuente: ${escapeHtml(inm.zona_tensionada_fuente)}</div>` : ""}
          </div>

          <div class="actions">
            <a class="btn" href="/static/inmueble.html?id=${inm.id_inmueble}">📄 Ver ficha</a>
            <button class="btn danger" onclick="trash(${inm.id_inmueble})">🗑️ Enviar a papelera</button>
          </div>
        </div>
      `).join("");

    }catch(e){
      list.innerHTML = `<div class="muted small">⚠️ Error cargando inmuebles.</div>`;
    }
  }

  async function trash(id){
    const ok = confirm("¿Enviar este inmueble a la papelera? Podrás restaurarlo.");
    if(!ok) return;

    try{
      const res = await fetch(`${apiUrl}/inmuebles/${id}`, {
        method:"DELETE",
        headers: { "Authorization": `Bearer ${token}` }
      });
      const data = await res.json().catch(()=>({}));
      if(!res.ok){ alert(data.detail || "Error enviando a papelera"); return; }
      await loadInmuebles();
    }catch(e){
      alert("Error de conexión");
    }
  }

  if(!token){ logout(); }
  loadStatus();
  loadInmuebles();
</script>
</body>
</html>
