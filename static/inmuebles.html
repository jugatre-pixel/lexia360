<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Lexia360 · Expedientes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css"/>
  <style>
    :root{ --bg:#f6f7fb; --card:#fff; --border:#e6e8ef; --muted:#667085; --brand:#0b5fff; --danger:#b42318; --ok:#027a48; }
    body{ margin:0; background:var(--bg); }
    header{ position:sticky; top:0; z-index:10; background:rgba(246,247,251,.92); backdrop-filter: blur(12px); border-bottom:1px solid var(--border); }
    .wrap{ max-width:1100px; margin:0 auto; padding:16px 18px; }
    .top{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
    .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; font-weight:1000; }
    .badge{ width:36px; height:36px; border-radius:12px; background:linear-gradient(135deg,var(--brand),#5b8cff); display:flex; align-items:center; justify-content:center; color:#fff; box-shadow:0 14px 28px rgba(11,95,255,.18); }
    .btn{ display:inline-flex; align-items:center; gap:8px; padding:10px 14px; border-radius:12px; border:1px solid var(--border); background:#fff; cursor:pointer; font-weight:900; text-decoration:none; color:inherit; }
    .btn.primary{ background:var(--brand); border-color:var(--brand); color:#fff; }
    .btn.danger{ border-color:#f0c9c8; color:var(--danger); }
    .btn.ghost{ background:transparent; }
    .grid{ display:grid; grid-template-columns:1fr; gap:14px; margin-top:14px; }
    .card{ background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; box-shadow:0 18px 40px rgba(16,24,40,.07); }
    .muted{ color:var(--muted); }
    .small{ font-size:13px; }
    .toolbar{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between; }
    .lefttools{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .tabs{ display:flex; gap:8px; flex-wrap:wrap; }
    .tab{ border:1px solid var(--border); background:#fff; padding:8px 12px; border-radius:999px; cursor:pointer; font-weight:900; }
    .tab.active{ border-color:rgba(11,95,255,.35); box-shadow:0 10px 26px rgba(11,95,255,.12); }
    input, select{ border-radius:12px !important; }
    table{ font-size:14px; }
    .pill{ display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; border:1px solid var(--border); background:#fff; font-weight:900; font-size:12px; }
    .pill.ok{ border-color:rgba(2,122,72,.25); color:var(--ok); }
    .pill.warn{ border-color:rgba(180,35,24,.25); color:var(--danger); }
    .pill.neutral{ color:var(--muted); }
    .row-actions{ display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; }
    .toast{ margin-top:10px; font-weight:900; font-size:13px; }
    .toast.ok{ color:var(--ok); }
    .toast.err{ color:var(--danger); }
    .empty{ border:1px dashed var(--border); background:#fff; border-radius:16px; padding:16px; color:var(--muted); }
  </style>
</head>
<body>
<header>
  <div class="wrap top">
    <a class="brand" href="/static/dashboard.html">
      <div class="badge">⚖️</div>
      <div>Lexia360</div>
    </a>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <a class="btn" href="/static/dashboard.html">🏠 Dashboard</a>
      <a class="btn" href="/static/papelera.html">🗑️ Papelera</a>
      <a class="btn primary" href="/static/wizard.html">➕ Nuevo expediente</a>
      <button class="btn" onclick="logout()">Cerrar sesión</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="grid">
    <section class="card">
      <div class="toolbar">
        <div>
          <h3 style="margin:0;">Expedientes</h3>
          <div class="muted small">Gestión de inmuebles (MVP). Borrado seguro con papelera.</div>
        </div>

        <div class="lefttools">
          <div class="tabs">
            <button class="tab active" id="tabActivos" onclick="setTab('activos')">Activos</button>
            <button class="tab" id="tabTrash" onclick="setTab('trash')">Papelera</button>
          </div>
        </div>
      </div>

      <hr/>

      <div class="toolbar" style="justify-content:space-between;">
        <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
          <input id="q" type="search" placeholder="Buscar por dirección, municipio..." style="min-width:260px;" oninput="render()"/>
          <select id="fSem" onchange="render()">
            <option value="">Semáforo: todos</option>
            <option value="VERDE">VERDE</option>
            <option value="ROJO">ROJO</option>
          </select>
        </div>
        <div class="muted small" id="countText">—</div>
      </div>

      <div id="toast" class="toast"></div>

      <div style="overflow:auto; margin-top:10px;">
        <table role="grid">
          <thead>
            <tr>
              <th>Dirección</th>
              <th>Municipio</th>
              <th>CA</th>
              <th>Renta</th>
              <th>Semáforo</th>
              <th style="text-align:right;">Acciones</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>

      <div id="empty" class="empty" style="display:none; margin-top:10px;">
        No hay expedientes aquí todavía. Crea uno desde “Nuevo expediente”.
      </div>
    </section>
  </div>
</main>

<script>
  const apiUrl = location.origin;
  const token = localStorage.getItem("token");
  if(!token) location.href="/static/index.html";

  let tab = "activos";
  let activos = [];
  let trash = [];

  function logout(){
    localStorage.removeItem("token");
    localStorage.removeItem("email");
    location.href="/static/index.html";
  }

  function esc(s){
    return String(s ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
  }

  function setToast(text, ok=true){
    const el = document.getElementById("toast");
    el.className = "toast " + (ok ? "ok" : "err");
    el.textContent = text || "";
    if(text){
      setTimeout(()=>{ el.textContent=""; }, 2600);
    }
  }

  function setTab(t){
    tab = t;
    document.getElementById("tabActivos").classList.toggle("active", t==="activos");
    document.getElementById("tabTrash").classList.toggle("active", t==="trash");
    // si vas a trash, cargo trash
    if(t==="trash") loadTrash();
    render();
  }

  async function api(path, opts={}){
    const res = await fetch(`${apiUrl}${path}`, {
      ...opts,
      headers: {
        "Authorization": `Bearer ${token}`,
        ...(opts.headers||{})
      }
    });
    if(res.status===401) logout();
    return res;
  }

  async function loadActivos(){
    const res = await api("/inmuebles");
    activos = await res.json().catch(()=>[]);
  }

  async function loadTrash(){
    const res = await api("/inmuebles/trash");
    if(!res.ok){
      const d = await res.json().catch(()=>({}));
      setToast(d.detail || "Error cargando papelera", false);
      trash = [];
      return;
    }
    trash = await res.json().catch(()=>[]);
  }

  function semPill(value){
    if(value==="VERDE") return `<span class="pill ok">● VERDE</span>`;
    if(value==="ROJO") return `<span class="pill warn">● ROJO</span>`;
    return `<span class="pill neutral">● —</span>`;
  }

  function money(v){
    if(v===null || v===undefined || v==="") return "—";
    const n = Number(v);
    if(Number.isNaN(n)) return esc(v);
    return n.toLocaleString("es-ES",{maximumFractionDigits:2}) + " €";
  }

  function filteredRows(){
    const q = document.getElementById("q").value.trim().toLowerCase();
    const fSem = document.getElementById("fSem").value;
    const data = (tab==="activos" ? activos : trash);

    return (data||[]).filter(i=>{
      const hay = `${i.direccion||""} ${i.municipio||""} ${i.comunidad_autonoma||""}`.toLowerCase();
      if(q && !hay.includes(q)) return false;
      if(fSem && (i.semaforo||"") !== fSem) return false;
      return true;
    });
  }

  function render(){
    const rows = filteredRows();
    const tbody = document.getElementById("tbody");
    tbody.innerHTML = "";

    document.getElementById("countText").textContent =
      `${rows.length} resultado(s) · vista: ${tab==="activos" ? "Activos" : "Papelera"}`;

    const empty = document.getElementById("empty");
    empty.style.display = rows.length ? "none" : "block";

    for(const i of rows){
      const tr = document.createElement("tr");

      const actions = (tab==="activos")
        ? `
          <div class="row-actions">
            <a class="btn" href="/static/inmueble.html?id=${i.id_inmueble}">Abrir</a>
            <button class="btn danger" onclick="moveToTrash(${i.id_inmueble})">Eliminar</button>
          </div>
        `
        : `
          <div class="row-actions">
            <button class="btn" onclick="restore(${i.id_inmueble})">Restaurar</button>
            <button class="btn danger" onclick="purge(${i.id_inmueble})">Borrar definitivo</button>
          </div>
        `;

      tr.innerHTML = `
        <td><b>${esc(i.direccion || "—")}</b></td>
        <td>${esc(i.municipio || "—")}</td>
        <td>${esc(i.comunidad_autonoma || "—")}</td>
        <td>${money(i.renta_propuesta)}</td>
        <td>${semPill(i.semaforo)}</td>
        <td style="text-align:right;">${actions}</td>
      `;
      tbody.appendChild(tr);
    }
  }

  async function moveToTrash(id){
    if(!confirm("¿Mover a papelera? (Se puede restaurar)")) return;
    const res = await api(`/inmuebles/${id}`, { method:"DELETE" });
    const d = await res.json().catch(()=>({}));
    if(!res.ok){ setToast(d.detail || "Error moviendo a papelera", false); return; }
    setToast("✅ Movido a papelera", true);
    await loadActivos();
    await loadTrash();
    render();
  }

  async function restore(id){
    const res = await api(`/inmuebles/${id}/restore`, { method:"POST" });
    const d = await res.json().catch(()=>({}));
    if(!res.ok){ setToast(d.detail || "Error restaurando", false); return; }
    setToast("✅ Restaurado", true);
    await loadActivos();
    await loadTrash();
    render();
  }

  async function purge(id){
    if(!confirm("⚠️ Borrado definitivo. ¿Seguro?")) return;
    const res = await api(`/inmuebles/${id}/purge`, { method:"DELETE" });
    const d = await res.json().catch(()=>({}));
    if(!res.ok){ setToast(d.detail || "Error en borrado definitivo", false); return; }
    setToast("🧨 Borrado definitivo completado", true);
    await loadTrash();
    render();
  }

  (async()=>{
    await loadActivos();
    render();
  })();
</script>
</body>
</html>
