<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <title>Lexia360 · Inmueble</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css"/>
</head>
<body>
<nav class="container-fluid">
  <ul><li><strong>Inmueble</strong></li></ul>
  <ul>
    <li><a href="/static/dashboard.html">Dashboard</a></li>
    <li><a href="/static/inmuebles.html">Inmuebles</a></li>
  </ul>
</nav>

<main class="container">
  <h2 id="title">Cargando...</h2>

  <article>
    <header><strong>Datos (debug)</strong></header>
    <pre id="data" style="max-height: 360px; overflow:auto;"></pre>
  </article>

  <div class="grid">
    <a id="pdf" role="button" class="secondary" href="#" target="_blank" rel="noopener">Descargar PDF</a>
    <a id="wizardLease" role="button" href="#">Generar contrato (Lease)</a>
  </div>

  <p id="msg" style="margin-top:12px;"></p>
</main>

<script>
const api = location.origin;
const token = localStorage.getItem("token");
if(!token) location.href="/static/index.html";

const id = new URLSearchParams(location.search).get("id");
if(!id) location.href="/static/inmuebles.html";

function setMsg(t, ok=true){
  const el=document.getElementById("msg");
  el.textContent=t || "";
  el.style.color = ok ? "" : "crimson";
}

async function authFetch(url, options={}){
  options.headers = options.headers || {};
  options.headers["Authorization"] = `Bearer ${token}`;
  return fetch(url, options);
}

async function load(){
  setMsg("Cargando inmueble...");
  const r = await authFetch(`${api}/inmuebles/${id}`);
  if(r.status===401) return location.href="/static/index.html";
  if(!r.ok){
    setMsg("No se pudo cargar el inmueble", false);
    return;
  }

  const d = await r.json();
  document.getElementById("title").textContent = d.direccion || `Inmueble ${id}`;
  document.getElementById("data").textContent = JSON.stringify(d, null, 2);

  // ✅ pedir token para PDF y montar link con ?t=
  const rt = await authFetch(`${api}/inmuebles/${id}/pdf-token`);
  if(!rt.ok){
    setMsg("No se pudo generar token PDF", false);
    return;
  }
  const jt = await rt.json();
  const pdfUrl = `${api}/inmuebles/${id}/pdf?t=${encodeURIComponent(jt.token)}`;
  const a = document.getElementById("pdf");
  a.href = pdfUrl;

  // botón contrato (lo dejamos preparado)
  document.getElementById("wizardLease").href = `/static/wizard_lease.html?inmueble_id=${encodeURIComponent(id)}`;

  setMsg("");
}

load();
</script>
</body>
</html>
