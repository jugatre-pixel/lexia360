<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lexia360 · Panel</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
</head>

<body>
<main class="container">
  <h2>Panel Lexia360</h2>
  <p id="user"></p>

  <div class="grid">
    <button onclick="go('wizard')">➕ Crear inmueble</button>
    <button onclick="go('inmuebles')">🏠 Inmuebles</button>
    <button onclick="go('papelera')">🗑️ Papelera</button>
    <button onclick="logout()">Cerrar sesión</button>
  </div>
</main>

<script>
const api = location.origin;
const token = localStorage.getItem("token");
if(!token) location.href="/static/index.html";

fetch(`${api}/me`,{headers:{Authorization:`Bearer ${token}`}})
  .then(r=>r.json())
  .then(d=>user.textContent=`Sesión: ${d.email}`);

function go(p){ location.href=`/static/${p}.html`; }
function logout(){
  localStorage.clear();
  location.href="/static/index.html";
}
</script>
</body>
</html>
