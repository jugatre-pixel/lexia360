<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lexia360 · Ficha inmueble</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css" />

  <style>
    :root{
      --bg:#f6f7fb; --border:#e6e8ef; --muted:#667085; --accent:#0b5fff; --danger:#b42318;
    }
    body{ background:var(--bg); }
    header{ position:sticky; top:0; z-index:10; background:rgba(246,247,251,.9); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); }
    .wrap{ max-width:1000px; margin:0 auto; padding:18px; }
    .topbar{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
    .btn{ display:inline-flex; gap:8px; align-items:center; padding:10px 14px; border-radius:10px; border:1px solid var(--border); background:#fff; cursor:pointer; font-weight:700; text-decoration:none; }
    .btn.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
    .btn.danger{ border-color:#ffb3b3; color:var(--danger); }
    .card{ background:#fff; border:1px solid var(--border); border-radius:14px; padding:16px; box-shadow:0 8px 18px rgba(16,24,40,.04); }
    .muted{ color:var(--muted); }
    .small{ font-size:13px; }
    .grid{ display:grid; grid-template-columns:1fr; gap:14px; margin-top:14px; }
    @media(min-width:900px){ .grid{ grid-template-columns: 1fr 1fr; } }
    .pill{ font-size:12px; padding:4px 10px; border-radius:999px; border:1px solid var(--border); background:#fafafa; display:inline-block; }
    .pill.green{ border-color:#b7ebc6; background:#f0fff4; }
    .pill.red{ border-color:#ffc4c4; background:#fff5f5; }
    ul{ margin: 8px 0 0 18px; }
  </style>
</head>

<body>
<header>
  <div class="wrap topbar">
    <div>
      <b>📄 Ficha del inmueble</b>
      <div class="muted small">Detalle + informe PDF</div>
    </div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <a class="btn" href="/static/dashboard.html">← Panel</a>
      <button class="btn primary" onclick="downloadPdf()">⬇️ Descargar PDF</button>
      <button class="btn" onclick="logout()">Cerrar sesión</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="card">
    <h3 style="margin:0 0 6px;" id="title">Cargando…</h3>
    <div class="muted small" id="subtitle"></div>
    <div style="margin-top:10px;" id="pills"></div>
  </section>

  <section class="grid">
    <div class="card">
      <h4 style="margin:0 0 10px;">Datos</h4>
      <div class="small" id="datos">—</div>
    </div>

    <div class="card">
      <h4 style="margin:0 0 10px;">Alertas</h4>
      <div class="small" id="alertas">—</div>
    </div>
  </section>
</main>

<script>
  const apiUrl = location.origin;
  const token = localStorage.getItem("token");

  function logout(){
    localStorage.removeItem("token");
    localStorage.removeItem("email");
    window.location.href = "/static/index.html";
  }

  const params = new URLSearchParams(location.search);
  const id = params.get("id");

  if(!token){ logout(); }
  if(!id){ alert("Falta id"); window.location.href="/static/dashboard.html"; }

  function pillSemaforo(s){
    if(s === "VERDE") return `<span class="pill green">🟢 OK</span>`;
    if(s === "ROJO") return `<span class="pill red">🔴 Riesgo</span>`;
    return `<span class="pill">—</span>`;
  }

  async function load(){
    try{
      const res = await fetch(`${apiUrl}/inmuebles/${id}`, {
        headers: { "Authorization": `Bearer ${token}` }
      });
      if(res.status === 401){ logout(); return; }
      const inm = await res.json();

      document.getElementById("title").textContent = inm.direccion || `Inmueble #${id}`;
      document.getElementById("subtitle").textContent = `${inm.municipio || "—"} · ${inm.comunidad_autonoma || "—"} · Análisis: ${inm.fecha_analisis || "—"}`;

      const zona = inm.zona_tensionada ? "Sí" : "No";
      document.getElementById("pills").innerHTML = `
        ${pillSemaforo(inm.semaforo)}
        <span class="pill">Zona tensionada: ${zona}</span>
        ${inm.zona_tensionada_fuente ? `<span class="pill">Fuente: ${escapeHtml(inm.zona_tensionada_fuente)}</span>` : ""}
      `;

      document.getElementById("datos").innerHTML = `
        <b>Renta propuesta:</b> ${inm.renta_propuesta ?? "—"} €<br>
        <b>Renta anterior:</b> ${inm.renta_anterior ?? "—"}<br>
        <b>Tipo arrendamiento:</b> ${escapeHtml(inm.tipo_arrendamiento || "—")}<br>
        <b>Tipo arrendador:</b> ${escapeHtml(inm.tipo_arrendador || "—")}<br>
        <b>CP:</b> ${escapeHtml(inm.codigo_postal || "—")}<br>
        <b>Superficie:</b> ${inm.superficie_m2 ?? "—"} m²<br>
      `;

      const alertas = Array.isArray(inm.alertas) ? inm.alertas : [];
      document.getElementById("alertas").innerHTML = alertas.length
        ? `<ul>${alertas.map(a => `<li>${escapeHtml(a)}</li>`).join("")}</ul>`
        : "—";

    }catch(e){
      alert("Error cargando ficha");
      window.location.href="/static/dashboard.html";
    }
  }

  async function downloadPdf(){
    try{
      const res = await fetch(`${apiUrl}/inmuebles/${id}/pdf`, {
        headers: { "Authorization": `Bearer ${token}` }
      });
      if(res.status === 401){ logout(); return; }
      if(!res.ok){
        const t = await res.text().catch(()=> "");
        alert("No se pudo generar el PDF: " + t);
        return;
      }

      const blob = await res.blob();
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = `lexia360_informe_inmueble_${id}.pdf`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }catch(e){
      alert("Error descargando PDF");
    }
  }

  function escapeHtml(str){
    return String(str)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  load();
</script>
</body>
</html>
