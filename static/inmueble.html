<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<title>Lexia360 · Inmueble</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css"/>
</head>
<body>
<main class="container">
  <h2 id="title"></h2>
  <pre id="data"></pre>
  <a id="pdf" role="button">Descargar PDF</a>
</main>

<script>
const api=location.origin;
const token=localStorage.getItem("token");
if(!token) location.href="/static/index.html";
const id=new URLSearchParams(location.search).get("id");

async function load(){
  const r=await fetch(api+"/inmuebles/"+id,{headers:{Authorization:`Bearer ${token}`}});
  if(r.status===401) location.href="/static/index.html";
  const d=await r.json();
  document.getElementById("title").textContent=d.direccion;
  document.getElementById("data").textContent=JSON.stringify(d,null,2);
  document.getElementById("pdf").href=api+"/inmuebles/"+id+"/pdf";
}
load();
</script>
</body>
</html>
