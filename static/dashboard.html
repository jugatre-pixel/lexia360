<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lexia360 · Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css" />
  <style>
    :root { --accent:#0b5fff; --muted:#667085; --bg:#f6f7fb; --card:#ffffff; --border:#e6e8ef; }
    body { background: var(--bg); }
    header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(246,247,251,0.85); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 18px 18px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .brand { display:flex; align-items:center; gap:10px; }
    .brand b { font-size: 18px; letter-spacing: .2px; }
    .pill { padding: 6px 10px; border:1px solid var(--border); border-radius: 999px; background:#fff; color: var(--muted); font-size: 13px; }
    .grid { display:grid; grid-template-columns: 1fr; gap:12px; }
    @media(min-width: 900px){ .grid { grid-template-columns: 1fr 1fr; } }
    .card {
      background: var(--card); border:1px solid var(--border); border-radius: 14px;
      padding: 16px; box-shadow: 0 8px 18px rgba(16,24,40,0.04);
    }
    .row { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
    .muted { color: var(--muted); }
    .badge { font-size: 12px; padding: 4px 8px; border-radius:999px; border:1px solid var(--border); background:#fff; }
    .b-green{ border-color:#b7ebc6; background:#f0fff4; }
    .b-red{ border-color:#ffc4c4; background:#fff5f5; }
    .b-amber{ border-color:#ffe0a3; background:#fffaf0; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top: 12px; }
    .btn { display:inline-flex; align-items:center; gap:8px; padding:10px 12px; border-radius: 10px; border:1px solid var(--border); background:#fff; cursor:pointer; }
    .btn.primary { background: var(--accent); color:#fff; border-color: var(--accent); }
    .btn:disabled{ opacity:.6; cursor:not-allowed; }
    .empty { text-align:center; padding: 26px; color: var(--muted); }
    .toast { margin-top: 10px; color:#b42318; }
    .small { font-size: 13px; }
  </style>
</head>
<body>
<header>
  <div class="wrap topbar">
    <div class="brand">
      <span style="font-size:20px">⚖️</span>
      <div>
        <b>Lexia360</b><div class="muted small">Panel de inmuebles</div>
      </div>
    </div>
    <div style="display:flex; gap:10px; align-items:center;">
      <span id="who" class="pill">—</span>
      <button class="btn" onclick="logout()">Cerrar sesión</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="row" style="margin: 10px 0 14px;">
    <div>
      <h3 style="margin:0;">Tus inmuebles</h3>
      <div class="muted small">Cada inmueble tiene su ficha legal con veredicto y recomendaciones.</div>
    </div>
    <div class="actions">
      <a class="btn primary" href="/static/wizard.html">➕ Nuevo inmueble</a>
      <button class="btn" onclick="load()">🔄 Actualizar</button>
    </div>
  </div>

  <section id="list" class="grid"></section>
  <div id="msg" class="toast"></div>
</main>

<script>
  const apiUrl = location.origin; // mismo dominio que el backend
  const token = localStorage.getItem("token");
  const email = localStorage.getItem("email") || "Usuario";

  document.getElementById("who").textContent = email;

  function logout(){
    localStorage.removeItem("token");
    localStorage.removeItem("email");
    window.location.href = "/static/index.html";
  }

  function semaforoBadge(semaforo){
    if(semaforo === "ROJO") return `<span class="badge b-red">🔴 Riesgo</span>`;
    if(semaforo === "AMBAR" || semaforo === "AMARILLO") return `<span class="badge b-amber">🟠 Atención</span>`;
    return `<span class="badge b-green">🟢 Correcto</span>`;
  }

  function euro(n){
    if(n === null || n === undefined) return "—";
    return new Intl.NumberFormat("es-ES", { style:"currency", currency:"EUR" }).format(n);
  }

  async function load(){
    const list = document.getElementById("list");
    const msg = document.getElementById("msg");
    msg.textContent = "";
    list.innerHTML = "";

    if(!token){
      window.location.href = "/static/index.html";
      return;
    }

    try{
      const res = await fetch(`${apiUrl}/inmuebles`, {
        headers: { "Authorization": `Bearer ${token}` }
      });

      if(res.status === 401){
        logout(); return;
      }

      const data = await res.json();
      if(!Array.isArray(data) || data.length === 0){
        list.innerHTML = `<div class="card empty">
          <h4 style="margin-top:0;">Aún no tienes inmuebles</h4>
          <p class="muted">Crea el primero para obtener tu ficha legal.</p>
          <a class="btn primary" href="/static/wizard.html">Crear inmueble</a>
        </div>`;
        return;
      }

      data.forEach(item => {
        const zona = item.zona_tensionada ? "Sí" : "No";
        const fuente = item.zona_tensionada_fuente ? item.zona_tensionada_fuente : "—";
        const f = item.fecha_analisis ? item.fecha_analisis : "—";

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="row">
            <div>
              <h4 style="margin:0 0 6px;">${item.direccion}</h4>
              <div class="muted small">${item.municipio} · ${item.comunidad_autonoma}</div>
            </div>
            <div>${semaforoBadge(item.semaforo)}</div>
          </div>

          <hr style="margin:14px 0; border-color: var(--border);" />

          <div class="row">
            <div class="small muted">Renta propuesta</div>
            <div><b>${euro(item.renta_propuesta)}</b></div>
          </div>
          <div class="row" style="margin-top:6px;">
            <div class="small muted">Zona tensionada</div>
            <div><b>${zona}</b></div>
          </div>
          <div class="small muted" style="margin-top:6px;">Fuente: ${fuente}</div>
          <div class="small muted" style="margin-top:6px;">Último análisis: ${f}</div>

          <div class="actions">
            <a class="btn primary" href="/static/inmueble.html?id=${encodeURIComponent(item.id_inmueble)}">Ver ficha legal</a>
          </div>
        `;
        list.appendChild(card);
      });

    }catch(e){
      msg.textContent = "⚠️ No se pudo cargar la lista. Revisa tu conexión.";
    }
  }

  load();
</script>
</body>
</html>
