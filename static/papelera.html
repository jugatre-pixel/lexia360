<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Lexia360 · Papelera</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css"/>
  <!-- Opcional:
  <meta name="api-base" content="https://tu-api.com"> -->
  <style>
    :root{
      --brand:#0b5fff; --brand2:#5b8cff;
      --bg:#0b1220; --muted:rgba(255,255,255,.72);
      --card:#ffffff; --border:#e6e8ef; --shadow:0 18px 44px rgba(16,24,40,.12);
      --radius:16px; --danger:#b42318;
    }
    body{
      margin:0;
      background:
        radial-gradient(1000px 520px at 20% 0%, rgba(11,95,255,.22), transparent 55%),
        radial-gradient(900px 520px at 90% 10%, rgba(91,140,255,.18), transparent 60%),
        linear-gradient(180deg, #0b1220 0%, #0f1a33 62%, #f6f7fb 62%, #f6f7fb 100%);
    }
    .wrap{max-width:1180px;margin:0 auto;padding:18px;}
    .topbar{
      position:sticky;top:0;z-index:50;
      background:rgba(11,18,32,.62);
      backdrop-filter: blur(12px);
      border-bottom:1px solid rgba(255,255,255,.10);
    }
    .toprow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
    .brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:950}
    .badge{
      width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg,var(--brand),var(--brand2));
      box-shadow:0 14px 28px rgba(11,95,255,.22);
    }
    .navlinks{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .chip{
      border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.06);
      color:#fff;padding:8px 12px;border-radius:999px;
      text-decoration:none;font-weight:900;font-size:13px;
    }
    .chip.active{background:rgba(255,255,255,.12)}
    .btn{
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.06);
      color:#fff;padding:10px 14px;border-radius:12px;
      font-weight:900;cursor:pointer;
    }
    .btn.danger{ background:rgba(180,35,24,.12); border-color:rgba(180,35,24,.35); color:#fff; }
    .btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:transparent}
    .hero{padding:28px 0 10px;}
    .headline{color:#fff;font-weight:1000;letter-spacing:-.3px;margin:0 0 6px}
    .sub{color:var(--muted);margin:0}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
    .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
    .muted2{color:#667085;font-size:13px}
    .toast{
      position:fixed;left:18px;bottom:18px;z-index:9999;
      background:#111827;color:#fff;border:1px solid rgba(255,255,255,.12);
      padding:12px 14px;border-radius:14px;box-shadow:0 18px 44px rgba(0,0,0,.25);
      display:none;max-width:560px;
    }
    .toast.show{display:block}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="wrap toprow">
      <a class="brand" href="/static/dashboard.html">
        <div class="badge">⚖️</div>
        <div>Lexia360</div>
      </a>

      <div class="navlinks">
        <a class="chip" href="/static/dashboard.html">Dashboard</a>
        <a class="chip" href="/static/inmuebles.html">Inmuebles</a>
        <a class="chip" href="/static/wizard.html">Wizard</a>
        <a class="chip active" href="/static/papelera.html">Papelera</a>
        <a class="chip" href="/static/documentos.html">Documentos</a>
        <button class="btn" type="button" onclick="logout()">Salir</button>
      </div>
    </div>
  </div>

  <section class="wrap hero">
    <h2 class="headline">Papelera</h2>
    <p class="sub">Recupera inmuebles o bórralos definitivamente.</p>
  </section>

  <section class="wrap">
    <div class="card">
      <div class="row" style="margin-bottom:10px;">
        <div>
          <b>Inmuebles eliminados</b>
          <div class="muted2">Solo aquí puedes borrar definitivamente (purge).</div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <button class="btn" type="button" onclick="load()">Actualizar</button>
        </div>
      </div>

      <figure style="margin:0;">
        <table role="grid">
          <thead>
            <tr>
              <th>ID</th>
              <th>Dirección</th>
              <th>Municipio</th>
              <th>CCAA</th>
              <th style="width:320px;">Acciones</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </figure>

      <div class="muted2" id="empty" style="display:none;margin-top:12px;">
        No hay inmuebles en papelera.
      </div>
    </div>
  </section>

  <div id="toast" class="toast"></div>

<script>
  function getApiBase(){
    const meta = document.querySelector('meta[name="api-base"]');
    return (meta && meta.content) ? meta.content.replace(/\/+$/,'') : location.origin;
  }
  const api = getApiBase();

  function token(){ return localStorage.getItem("token"); }
  function authHeaders(extra={}){ return { ...extra, "Authorization": `Bearer ${token()}` }; }

  function logout(){
    localStorage.removeItem("token");
    localStorage.removeItem("email");
    location.href="/static/index.html";
  }

  function guard(){
    if(!token()){ location.href="/static/index.html"; return false; }
    return true;
  }

  function toast(msg){
    const el=document.getElementById("toast");
    el.textContent=msg;
    el.classList.add("show");
    setTimeout(()=>el.classList.remove("show"), 4200);
  }

  async function safeJson(res){ try{return await res.json();}catch{return {};} }

  function tdText(tr, text){
    const td = document.createElement("td");
    td.textContent = text ?? "—";
    tr.appendChild(td);
    return td;
  }

  async function load(){
    if(!guard()) return;
    try{
      const r = await fetch(`${api}/inmuebles/trash`, { headers: authHeaders() });
      if(r.status===401) return logout();
      const d = await safeJson(r);
      if(!r.ok){ toast(d.detail || "No se pudo cargar la papelera"); return; }

      const rows = document.getElementById("rows");
      rows.innerHTML = "";
      const arr = Array.isArray(d) ? d : [];
      document.getElementById("empty").style.display = (arr.length===0) ? "block" : "none";

      for(const i of arr){
        const tr = document.createElement("tr");
        tdText(tr, i.id_inmueble);
        tdText(tr, i.direccion);
        tdText(tr, i.municipio);
        tdText(tr, i.comunidad_autonoma);

        const tdAct = document.createElement("td");
        const box = document.createElement("div");
        box.style.display = "flex";
        box.style.gap = "8px";
        box.style.flexWrap = "wrap";

        const restoreBtn = document.createElement("button");
        restoreBtn.className = "btn primary";
        restoreBtn.type = "button";
        restoreBtn.textContent = "Restaurar";
        restoreBtn.onclick = () => restore(i.id_inmueble);

        const purgeBtn = document.createElement("button");
        purgeBtn.className = "btn danger";
        purgeBtn.type = "button";
        purgeBtn.textContent = "Borrar definitivo";
        purgeBtn.onclick = () => purge(i.id_inmueble);

        box.appendChild(restoreBtn);
        box.appendChild(purgeBtn);
        tdAct.appendChild(box);
        tr.appendChild(tdAct);

        rows.appendChild(tr);
      }
    }catch(e){
      toast("⚠️ Error de conexión");
    }
  }

  async function restore(id){
    if(!confirm("¿Restaurar este inmueble?")) return;
    try{
      const r = await fetch(`${api}/inmuebles/${encodeURIComponent(id)}/restore`, {
        method:"POST",
        headers: authHeaders()
      });
      if(r.status===401) return logout();
      const d = await safeJson(r);
      if(!r.ok){ toast(d.detail || "No se pudo restaurar"); return; }
      toast("✅ Inmueble restaurado");
      load();
    }catch(e){
      toast("⚠️ Error de conexión");
    }
  }

  async function purge(id){
    if(!confirm("Borrado definitivo. ¿Seguro?")) return;
    try{
      const r = await fetch(`${api}/inmuebles/${encodeURIComponent(id)}/purge`, {
        method:"DELETE",
        headers: authHeaders()
      });
      if(r.status===401) return logout();
      const d = await safeJson(r);
      if(!r.ok){ toast(d.detail || "No se pudo borrar definitivamente"); return; }
      toast("🧨 Borrado definitivo completado");
      load();
    }catch(e){
      toast("⚠️ Error de conexión");
    }
  }

  load();
</script>
</body>
</html>
