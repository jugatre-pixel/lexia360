<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Lexia360 · Papelera</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css"/>
  <style>
    :root{
      --brand:#0b5fff; --brand2:#5b8cff;
      --bg:#0b1220; --muted:rgba(255,255,255,.72);
      --card:#ffffff; --border:#e6e8ef; --shadow:0 18px 44px rgba(16,24,40,.12);
      --radius:16px;
      --danger:#b42318; --warn:#b54708;
    }
    body{
      margin:0;
      background:
        radial-gradient(1000px 520px at 20% 0%, rgba(11,95,255,.22), transparent 55%),
        radial-gradient(900px 520px at 90% 10%, rgba(91,140,255,.18), transparent 60%),
        linear-gradient(180deg, #0b1220 0%, #0f1a33 62%, #f6f7fb 62%, #f6f7fb 100%);
    }
    .wrap{max-width:1180px;margin:0 auto;padding:18px;}
    .topbar{
      position:sticky;top:0;z-index:50;
      background:rgba(11,18,32,.62);
      backdrop-filter: blur(12px);
      border-bottom:1px solid rgba(255,255,255,.10);
    }
    .toprow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
    .brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:950}
    .badge{
      width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg,var(--brand),var(--brand2));
      box-shadow:0 14px 28px rgba(11,95,255,.22);
    }
    .navlinks{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .chip{
      border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.06);
      color:#fff;padding:8px 12px;border-radius:999px;
      text-decoration:none;font-weight:900;font-size:13px;
    }
    .chip.active{background:rgba(255,255,255,.12)}
    .btn{
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.06);
      color:#fff;padding:10px 14px;border-radius:12px;
      font-weight:900;cursor:pointer;
    }
    .btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:transparent}
    .hero{padding:28px 0 10px;}
    .headline{color:#fff;font-weight:1000;letter-spacing:-.3px;margin:0 0 6px}
    .sub{color:var(--muted);margin:0}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
    .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
    .muted2{color:#667085;font-size:13px}
    table{border-radius:16px;overflow:hidden}
    .pill{
      font-size:12px;color:#111827;border:1px solid var(--border);background:#fff;
      padding:6px 10px;border-radius:999px;font-weight:900;
    }
    .toast{
      position:fixed;left:18px;bottom:18px;z-index:9999;
      background:#111827;color:#fff;border:1px solid rgba(255,255,255,.12);
      padding:12px 14px;border-radius:14px;box-shadow:0 18px 44px rgba(0,0,0,.25);
      display:none;max-width:560px;
    }
    .toast.show{display:block}
    .danger{background:var(--danger) !important;border-color:var(--danger) !important}
    .warn{background:var(--warn) !important;border-color:var(--warn) !important}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="wrap toprow">
      <a class="brand" href="/static/dashboard.html">
        <div class="badge">⚖️</div>
        <div>Lexia360</div>
      </a>

      <div class="navlinks">
        <a class="chip" href="/static/dashboard.html">Dashboard</a>
        <a class="chip" href="/static/inmuebles.html">Inmuebles</a>
        <a class="chip" href="/static/wizard.html">Wizard</a>
        <a class="chip active" href="/static/papelera.html">Papelera</a>
        <button class="btn" onclick="logout()">Salir</button>
      </div>
    </div>
  </div>

  <section class="wrap hero">
    <h2 class="headline">Papelera</h2>
    <p class="sub">Elementos eliminados (recuperables). Puedes restaurar o borrar definitivamente.</p>
  </section>

  <section class="wrap">
    <div class="card">
      <div class="row" style="margin-bottom:10px;">
        <div>
          <b>Elementos en papelera</b>
          <div class="muted2">Si tu sesión caducó, te mandará al login.</div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <button class="btn" onclick="load()">Actualizar</button>
          <a href="/static/inmuebles.html" role="button" class="secondary">Volver a activos</a>
        </div>
      </div>

      <figure style="margin:0;">
        <table role="grid">
          <thead>
            <tr>
              <th>ID</th>
              <th>Dirección</th>
              <th>Estado</th>
              <th style="width:320px;">Acciones</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </figure>

      <div class="muted2" id="empty" style="display:none;margin-top:12px;">
        La papelera está vacía.
      </div>
    </div>
  </section>

  <div id="toast" class="toast"></div>

<script>
  const apiUrl = location.origin;

  function token(){ return localStorage.getItem("token"); }
  function authHeaders(extra={}){ return { ...extra, "Authorization": `Bearer ${token()}` }; }

  function logout(){
    localStorage.removeItem("token");
    localStorage.removeItem("email");
    window.location.href="/static/index.html";
  }

  function guard(){
    const t = token();
    if(!t){ logout(); return false; }
    return true;
  }

  function toast(msg){
    const el=document.getElementById("toast");
    el.textContent=msg; el.classList.add("show");
    setTimeout(()=>el.classList.remove("show"), 4200);
  }

  async function safeJson(res){ try{return await res.json();}catch{return {};} }

  function escapeHtml(s){
    return (s??"").toString()
      .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
      .replaceAll('"',"&quot;").replaceAll("'","&#039;");
  }

  function getId(i){ return i.id_inmueble ?? i.id ?? i.idInmueble; }

  function render(list){
    const tbody = document.getElementById("rows");
    tbody.innerHTML = "";
    document.getElementById("empty").style.display = (list.length===0) ? "block" : "none";

    for(const i of list){
      const id = getId(i);
      const dir = i.direccion || "—";
      const st = (i.activo === false) ? "En papelera" : "—";

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><b>${id ?? "—"}</b></td>
        <td>
          <div style="font-weight:950;">${escapeHtml(dir)}</div>
          <div class="muted2">${escapeHtml((i.municipio||"") + (i.comunidad_autonoma?(" · "+i.comunidad_autonoma):""))}</div>
        </td>
        <td><span class="pill">${escapeHtml(st)}</span></td>
        <td>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="warn" onclick="restore(${Number(id)})">↩︎ Restaurar</button>
            <button class="danger" onclick="purge(${Number(id)})">Eliminar definitivo</button>
          </div>
        </td>
      `;
      tbody.appendChild(tr);
    }
  }

  async function load(){
    if(!guard()) return;

    try{
      const res = await fetch(`${apiUrl}/inmuebles/trash`, { headers: authHeaders() });
      if(res.status===401){ logout(); return; }

      const data = await safeJson(res);
      if(!res.ok){
        toast(data.detail || "No se pudo cargar la papelera.");
        render([]);
        return;
      }

      render(Array.isArray(data) ? data : []);
    }catch(e){
      toast("⚠️ Error de conexión.");
    }
  }

  async function restore(id){
    if(!guard()) return;
    if(!confirm("¿Restaurar este inmueble?")) return;

    try{
      const res = await fetch(`${apiUrl}/inmuebles/${id}/restore`, {
        method:"POST",
        headers: authHeaders()
      });
      if(res.status===401){ logout(); return; }
      const data = await safeJson(res);

      if(!res.ok){
        toast(data.detail || "No se pudo restaurar.");
        return;
      }
      toast("✅ Restaurado.");
      await load();
    }catch(e){
      toast("⚠️ Error de conexión.");
    }
  }

  async function purge(id){
    if(!guard()) return;
    if(!confirm("⚠️ Esto borra definitivamente. ¿Continuar?")) return;

    try{
      const res = await fetch(`${apiUrl}/inmuebles/${id}/purge`, {
        method:"DELETE",
        headers: authHeaders()
      });
      if(res.status===401){ logout(); return; }
      const data = await safeJson(res);

      if(!res.ok){
        toast(data.detail || "No se pudo borrar definitivo.");
        return;
      }
      toast("🧹 Eliminado definitivamente.");
      await load();
    }catch(e){
      toast("⚠️ Error de conexión.");
    }
  }

  load();
</script>
</body>
</html>
