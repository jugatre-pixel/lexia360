<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lexia360 · Crear inmueble</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
</head>

<body>
<main class="container">
  <h2>Crear inmueble</h2>

  <label>Dirección</label>
  <input id="direccion">

  <label>Municipio</label>
  <input id="municipio">

  <label>Comunidad Autónoma</label>
  <input id="ca">

  <label>Renta propuesta (€)</label>
  <input id="renta" type="number">

  <button onclick="crear()">Guardar y analizar</button>
</main>

<script>
const api = location.origin;
const token = localStorage.getItem("token");
if(!token) location.href="/static/index.html";

async function crear(){
  const r = await fetch(`${api}/inmuebles`,{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":`Bearer ${token}`
    },
    body:JSON.stringify({
      direccion:direccion.value,
      municipio:municipio.value,
      comunidad_autonoma:ca.value,
      renta_propuesta:Number(renta.value)
    })
  });

  const d = await r.json();
  if(!r.ok) return alert(d.detail || "Error");
  location.href = `/static/inmueble.html?id=${d.id_inmueble}`;
}
</script>
</body>
</html>
