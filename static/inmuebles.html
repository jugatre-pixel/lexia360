<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<title>Lexia360 · Inmuebles</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css"/>
</head>
<body>
<nav class="container-fluid">
  <ul><li><strong>Inmuebles</strong></li></ul>
  <ul>
    <li><a href="/static/dashboard.html">Dashboard</a></li>
    <li><a href="/static/wizard.html">Nuevo</a></li>
    <li><a href="/static/papelera.html">Papelera</a></li>
  </ul>
</nav>

<main class="container">
  <table>
    <thead>
      <tr><th>ID</th><th>Dirección</th><th>Acciones</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</main>

<script>
const api = location.origin;
const token = localStorage.getItem("token");
if(!token) location.href="/static/index.html";

async function load(){
  const r = await fetch(api+"/inmuebles",{headers:{Authorization:`Bearer ${token}`}});
  if(r.status===401) location.href="/static/index.html";
  const data = await r.json();
  const tbody = document.getElementById("rows");
  tbody.innerHTML="";
  data.forEach(i=>{
    tbody.innerHTML+=`
      <tr>
        <td>${i.id_inmueble}</td>
        <td>${i.direccion}</td>
        <td>
          <a href="/static/inmueble.html?id=${i.id_inmueble}">Ver</a>
          <button onclick="del(${i.id_inmueble})">Eliminar</button>
        </td>
      </tr>`;
  });
}

async function del(id){
  if(!confirm("¿Enviar a papelera?")) return;
  await fetch(api+"/inmuebles/"+id,{method:"DELETE",headers:{Authorization:`Bearer ${token}`}});
  load();
}
load();
</script>
</body>
</html>
