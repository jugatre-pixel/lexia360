<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Lexia360 · Checkout</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css"/>
  <style>
    body{ background:#f6f7fb; }
    .wrap{ max-width:980px; margin:0 auto; padding:18px; }
    .card{ background:#fff; border:1px solid #e6e8ef; border-radius:16px; padding:16px; box-shadow:0 18px 40px rgba(16,24,40,.07); }
    .grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
    @media(max-width:900px){ .grid{ grid-template-columns:1fr; } }
    .muted{ color:#667085; }
  </style>
</head>
<body>
  <main class="wrap">
    <h2>Comprar documento</h2>
    <p class="muted">Elige un producto y paga con Stripe. Después se genera tu documento automáticamente.</p>

    <article class="card">
      <label>Inmueble (opcional para este producto)</label>
      <input id="inmuebleId" type="number" placeholder="Ej: 12" />

      <hr/>

      <div id="msg" class="muted"></div>
      <div id="products" class="grid"></div>
    </article>
  </main>

<script>
  const api = location.origin;
  const token = localStorage.getItem("token");
  if(!token) location.href="/static/index.html";

  const msg = document.getElementById("msg");
  const box = document.getElementById("products");

  function authHeaders(extra={}){ return { ...extra, "Authorization": `Bearer ${token}` }; }

  function setMsg(t){ msg.textContent = t || ""; }

  async function loadProducts(){
    setMsg("Cargando catálogo...");
    const r = await fetch(api + "/products", { headers: authHeaders() });
    if(r.status===401) return location.href="/static/index.html";
    const data = await r.json().catch(()=>[]);
    if(!r.ok){
      setMsg("No se pudo cargar /products");
      return;
    }

    box.innerHTML = "";
    if(!Array.isArray(data) || data.length===0){
      setMsg("No hay productos activos.");
      return;
    }

    setMsg("");

    data.forEach(p=>{
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `
        <h4 style="margin:0 0 6px;">${p.name}</h4>
        <div class="muted" style="margin-bottom:10px;">${p.description || ""}</div>
        <b>${p.price_display}</b>
        <div style="margin-top:12px;">
          <button onclick="buy(${p.id_product})">Pagar con Stripe</button>
        </div>
      `;
      box.appendChild(div);
    });
  }

  async function buy(product_id){
    const inmueble_id_raw = document.getElementById("inmuebleId").value;
    const inmueble_id = inmueble_id_raw ? Number(inmueble_id_raw) : null;

    setMsg("Creando checkout...");
    const r = await fetch(api + "/checkout/create", {
      method:"POST",
      headers: authHeaders({ "Content-Type":"application/json" }),
      body: JSON.stringify({ product_id, inmueble_id })
    });

    if(r.status===401) return location.href="/static/index.html";
    const data = await r.json().catch(()=>({}));

    if(!r.ok){
      setMsg(data.detail || "Error creando checkout.");
      return;
    }

    // redirige a Stripe
    window.location.href = data.checkout_url;
  }

  loadProducts();
</script>
</body>
</html>
