<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Lexia360 · Inmueble</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css"/>
</head>
<body>
<main class="container">
  <nav>
    <ul>
      <li><strong>Lexia360</strong></li>
    </ul>
    <ul>
      <li><a href="/static/dashboard.html">Dashboard</a></li>
      <li><a href="/static/inmuebles.html">Inmuebles</a></li>
      <li><a href="/static/papelera.html">Papelera</a></li>
      <li><a href="/static/wizard.html">Nuevo expediente</a></li>
    </ul>
  </nav>

  <h2 id="title" style="margin-top:16px;">Inmueble</h2>
  <p class="muted" id="meta" style="opacity:.75;"></p>

  <div style="display:flex; gap:10px; flex-wrap:wrap; margin:12px 0;">
    <a id="pdf" role="button" href="#" aria-busy="true">Preparando PDF...</a>
    <button class="secondary" onclick="copyJson()">Copiar JSON</button>
    <button class="contrast" onclick="logout()">Salir</button>
  </div>

  <details open>
    <summary>JSON (debug)</summary>
    <pre id="data" style="max-height:520px; overflow:auto;"></pre>
  </details>
</main>

<script>
  const api = location.origin;
  const token = localStorage.getItem("token");
  if(!token) location.href="/static/index.html";

  const id = new URLSearchParams(location.search).get("id");
  if(!id) location.href="/static/inmuebles.html";

  function logout(){
    localStorage.removeItem("token");
    localStorage.removeItem("email");
    location.href="/static/index.html";
  }

  async function safeJson(res){
    try { return await res.json(); } catch { return {}; }
  }

  async function load(){
    // 1) Cargar inmueble (con Authorization)
    const r = await fetch(`${api}/inmuebles/${id}`, {
      headers:{ Authorization:`Bearer ${token}` }
    });
    if(r.status===401) return logout();

    const d = await safeJson(r);
    if(!r.ok){
      document.getElementById("title").textContent = "Error";
      document.getElementById("data").textContent = JSON.stringify(d, null, 2);
      return;
    }

    document.getElementById("title").textContent = d.direccion || `Inmueble ${id}`;
    document.getElementById("meta").textContent = `${d.municipio || ""}${d.comunidad_autonoma ? " · " + d.comunidad_autonoma : ""}`.trim();
    document.getElementById("data").textContent = JSON.stringify(d, null, 2);

    // 2) Pedir token de PDF (con Authorization)
    const tRes = await fetch(`${api}/inmuebles/${id}/pdf-token`, {
      headers:{ Authorization:`Bearer ${token}` }
    });
    if(tRes.status===401) return logout();

    const tData = await safeJson(tRes);
    const btn = document.getElementById("pdf");

    if(!tRes.ok || !tData.token){
      btn.setAttribute("aria-busy","false");
      btn.textContent = "No se pudo preparar el PDF";
      btn.href = "#";
      return;
    }

    // 3) Link sin headers pero con token en query -> ya NO habrá 401
    btn.setAttribute("aria-busy","false");
    btn.textContent = "Descargar PDF";
    btn.href = `${api}/inmuebles/${id}/pdf?t=${encodeURIComponent(tData.token)}`;
    btn.target = "_blank";
    btn.rel = "noopener";
  }

  async function copyJson(){
    const text = document.getElementById("data").textContent || "";
    try{
      await navigator.clipboard.writeText(text);
      alert("✅ JSON copiado");
    }catch(e){
      alert("⚠️ No se pudo copiar (permiso del navegador).");
    }
  }

  load();
</script>
</body>
</html>
